# Workflow CI/CD de Publicación del Servidor MCP (@sinfallas/mcp-qa-11x) en npmjs.org
# Cumple con DISA ASD STIG V6R5 (V-222513, V-222645) y SLSA Provenance Nivel 2

name: Publish MCP Server to npmjs

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Requerido para atestación criptográfica SLSA Provenance en npmjs

jobs:
  validate-and-publish:
    name: 11X QA Validation & NPM Publication
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js 22 (LTS) & NPM Registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Static Analysis (ESLint & SonarJS)
        run: pnpm run lint

      - name: 🛡️ Strict TypeScript Typecheck
        run: pnpm run typecheck

      - name: 🧪 11X Unit Tests (>= 95% Coverage Gate)
        run: pnpm run test:unit

      - name: ⚙️ Compile TypeScript to Production dist/
        run: pnpm run build

      - name: 📦 Dry-Run Package Verification
        run: npm pack --dry-run

      - name: 🚀 Publish to npmjs.org with SLSA Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
