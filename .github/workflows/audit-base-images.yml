name: QA 11X Daily Base Images & CodeQL Security Audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/audit-base-images.yml'
      - 'docker-compose.qa.yml'
      - 'RESOURCES.md'
      - 'SECURITY.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-base-images:
    name: Trivy Image Audit (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'sinfallas/base-python-uv:latest'
          - 'sinfallas/base-python-uv:3.15'
          - 'sinfallas/base-node-ionic:latest'
          - 'sinfallas/base-node-ionic:26'
          - 'sinfallas/basephpcomposer:latest'
          - 'sinfallas/karatelabs:latest'
          - 'sinfallas/base-bash-qa:latest'
          - 'sinfallas/remote-graphify:latest'

    steps:
      - name: Scan official Docker Hub image with Trivy (HIGH/CRITICAL = 0)
        env:
          TARGET_IMAGE: ${{ matrix.image }}
          TRIVY_DB_REPOS: 'public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2'
          TRIVY_JAVA_DB_REPOS: 'public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1'
        run: |
          docker run --rm \
            -v qa11x_trivy_cache:/root/.cache/trivy \
            aquasec/trivy:latest image \
            --db-repository "${TRIVY_DB_REPOS}" \
            --java-db-repository "${TRIVY_JAVA_DB_REPOS}" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${TARGET_IMAGE}"

  pip-audit-python-uv:
    name: Python v2 Preinstalled Dependencies Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Audit preinstalled Python packages in non-root container (UID 10001)
        run: |
          docker run --rm \
            --user 10001:10001 \
            -e HOME=/tmp \
            sinfallas/base-python-uv:latest \
            pip-audit --strict --desc

  codeql-security-analysis:
    name: CodeQL Security Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'javascript-typescript'
          - 'python'
          - 'actions'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:${{ matrix.language }}"
