name: QA 11X Daily Base Images & CodeQL Security Audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'Makefile'
      - '.trivy.yaml'
      - 'docker-compose.qa.yml'
      - '*/docker-compose.qa.yml*'
      - 'mcp-server/**'
      - 'mcp-server/example/docker-compose.qa.yml'
      - '.agents/scripts/**'
      - 'scripts/auditar-infra.sh'
      - 'scripts/generar-sbom-cyclonedx.sh'
      - 'tests/**'
      - '*/package.json*'
      - '*/pyproject.toml*'
      - '*/composer.json*'
      - 'ai-evals/**'
      - 'vibe-rescue/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-trivy-db:
    name: Warm Shared Trivy Vulnerability DB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Compute UTC date key
        id: utc-day
        run: printf 'day=%s\n' "$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

      - name: Cache Trivy vulnerability databases
        id: trivy-db-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.utc-day.outputs.day }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Download Trivy DB & Java DB
        if: steps.trivy-db-cache.outputs.cache-hit != 'true'
        env:
          TRIVY_DB_REPOS: 'public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2'
          TRIVY_JAVA_DB_REPOS: 'public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1'
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            -v "${RUNNER_TEMP}/trivy-cache:/tmp/trivy-cache" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            --db-repository "${TRIVY_DB_REPOS}" \
            --download-db-only
          docker run --rm \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            -v "${RUNNER_TEMP}/trivy-cache:/tmp/trivy-cache" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            --java-db-repository "${TRIVY_JAVA_DB_REPOS}" \
            --download-java-db-only

  trivy-base-images:
    name: Trivy Image Audit (${{ matrix.image }})
    needs: [warm-trivy-db]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4'
          - 'sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60'
          - 'sinfallas/basephpcomposer:8.5@sha256:56ff6d2dbf8b13833555b56ddc517bf520506b669c235026bb23224b212f0208'
          - 'sinfallas/karatelabs:1.5.1@sha256:a9a52ca9c5491ab39b64f0b4fdc3dea879c2213c9bc995be58d6cd4b9a80cc89'
          - 'sinfallas/base-bash-qa@sha256:2d1f579e20ef384e85da839304dbae2d28231fcdc893c21cbe79861b44d675a7'
          - 'sinfallas/remote-graphify@sha256:08aa6a6fc5e72f25bb6a37da632932fe295ba0d72fd971ae5b365eeea3f778b0'
          - 'sinfallas/base-mobile-appium:26@sha256:1bb9e70613a786008fe06c418a557aeaa5fe7c62b3db29a26b4e0ce86d3c6728'

    steps:
      - name: Compute UTC date key
        id: utc-day
        run: printf 'day=%s\n' "$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

      - name: Restore Trivy vulnerability databases
        id: trivy-db-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.utc-day.outputs.day }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan official Docker Hub image with Trivy (HIGH/CRITICAL = 0)
        env:
          TARGET_IMAGE: ${{ matrix.image }}
          EVENT_NAME: ${{ github.event_name }}
          CACHE_HIT: ${{ steps.trivy-db-cache.outputs.cache-hit }}
          TRIVY_DB_REPOS: 'public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2'
          TRIVY_JAVA_DB_REPOS: 'public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1'
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          TRIVY_ARGS=(
            "--severity" "HIGH,CRITICAL"
            "--ignore-unfixed"
            "--exit-code" "1"
          )
          if [ "${CACHE_HIT:-false}" = "true" ] && [ -s "${RUNNER_TEMP}/trivy-cache/db/trivy.db" ] && [ -s "${RUNNER_TEMP}/trivy-cache/java-db/trivy-java.db" ]; then
            TRIVY_ARGS+=(--skip-db-update --skip-java-db-update)
          else
            TRIVY_ARGS+=(--db-repository "${TRIVY_DB_REPOS}" --java-db-repository "${TRIVY_JAVA_DB_REPOS}")
          fi

          SCAN_RC=0
          SCAN_OUT="$(docker run --rm \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            -v "${RUNNER_TEMP}/trivy-cache:/tmp/trivy-cache" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            "${TRIVY_ARGS[@]}" \
            "${TARGET_IMAGE}" 2>&1)" || SCAN_RC=$?
          printf '%s\n' "${SCAN_OUT}"

          MODE_LABEL="BLOQUEANTE"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            MODE_LABEL="INFORMATIVO PR"
          fi
          STATUS_LABEL="PASS (HIGH/CRITICAL = 0)"
          if [ "${SCAN_RC}" -ne 0 ]; then
            STATUS_LABEL="UPSTREAM_CVE_DETECTED (exit ${SCAN_RC})"
          fi

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Trivy Base Image Audit: \`${TARGET_IMAGE}\`"
              echo ""
              echo "| Imagen | Modo | Estado |"
              echo "| :--- | :--- | :--- |"
              echo "| \`${TARGET_IMAGE}\` | \`${MODE_LABEL}\` | \`${STATUS_LABEL}\` |"
              if [ "${SCAN_RC}" -ne 0 ]; then
                echo ""
                echo "<details><summary>CVEs HIGH/CRITICAL con fix detectados</summary>"
                echo ""
                echo '```text'
                printf '%s\n' "${SCAN_OUT}" | tail -n 80
                echo '```'
                echo "</details>"
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${SCAN_RC}"

  pip-audit-python-uv:
    name: Python 3.15 Preinstalled Dependencies Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Audit preinstalled Python packages in non-root container (UID 10001)
        run: |
          docker run --rm \
            --security-opt=no-new-privileges:true \
            --user 10001:10001 \
            -e HOME=/tmp \
            sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 \
            pip-audit --strict --desc

  smoke-mobile-appium:
    name: Mobile Appium v26 Base Image Smoke (Non-Root + Appium + ADB)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify non-root runtime, Java 21, Android ADB & Appium drivers (UID 10001)
        run: |
          docker run --rm \
            --security-opt=no-new-privileges:true \
            --user 10001:10001 \
            -e HOME=/tmp \
            sinfallas/base-mobile-appium:26@sha256:1bb9e70613a786008fe06c418a557aeaa5fe7c62b3db29a26b4e0ce86d3c6728 \
            sh -ec 'test "$(id -u)" = "10001" && java -version && adb version && node --version && pnpm --version && appium --version && appium driver list --installed --json'

  codeql-security-analysis:
    name: CodeQL Security Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'javascript-typescript'
          - 'python'
          - 'actions'

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
