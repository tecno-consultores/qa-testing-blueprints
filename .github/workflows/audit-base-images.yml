name: QA 11X Daily Base Images & CodeQL Security Audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/audit-base-images.yml'
      - 'Makefile'
      - 'docker-compose.qa.yml'
      - '*/docker-compose.qa.yml'
      - 'mcp-server/example/docker-compose.qa.yml'
      - 'RESOURCES.md'
      - 'SECURITY.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-base-images:
    name: Trivy Image Audit (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'sinfallas/base-python-uv:latest' # qa-audit-latest-target
          - 'sinfallas/base-python-uv:3.15'
          - 'sinfallas/base-node-ionic:latest' # qa-audit-latest-target
          - 'sinfallas/base-node-ionic:26'
          - 'sinfallas/basephpcomposer:latest' # qa-audit-latest-target
          - 'sinfallas/basephpcomposer:8.5'
          - 'sinfallas/karatelabs:1.5.1'
          - 'sinfallas/karatelabs:latest' # qa-audit-latest-target
          - 'sinfallas/base-bash-qa:latest' # qa-audit-latest-target
          - 'sinfallas/remote-graphify:latest' # qa-audit-latest-target
          - 'sinfallas/base-mobile-appium:latest' # qa-audit-latest-target
          - 'sinfallas/base-mobile-appium:26'

    steps:
      - name: Scan official Docker Hub image with Trivy (HIGH/CRITICAL = 0)
        env:
          TARGET_IMAGE: ${{ matrix.image }}
          TRIVY_DB_REPOS: 'public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2'
          TRIVY_JAVA_DB_REPOS: 'public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1'
        run: |
          docker run --rm \
            -v qa11x_trivy_cache:/root/.cache/trivy \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            --db-repository "${TRIVY_DB_REPOS}" \
            --java-db-repository "${TRIVY_JAVA_DB_REPOS}" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${TARGET_IMAGE}"

  pip-audit-python-uv:
    name: Python v2 Preinstalled Dependencies Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Audit preinstalled Python packages in non-root container (UID 10001)
        run: |
          docker run --rm \
            --user 10001:10001 \
            -e HOME=/tmp \
            sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 \
            pip-audit --strict --desc

  smoke-mobile-appium:
    name: Mobile Appium v26 Base Image Smoke (Non-Root + Appium + ADB)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify non-root runtime, Java 21, Android ADB & Appium drivers (UID 10001)
        run: |
          docker run --rm \
            --user 10001:10001 \
            -e HOME=/tmp \
            sinfallas/base-mobile-appium:26@sha256:595b467d1476de0bc66e4bff35e37599dd889efa7f0222ee7418f159c102af91 \
            sh -ec 'test "$(id -u)" = "10001" && java -version && adb version && node --version && pnpm --version && appium --version && appium driver list --installed --json'

  codeql-security-analysis:
    name: CodeQL Security Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'javascript-typescript'
          - 'python'
          - 'actions'

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
