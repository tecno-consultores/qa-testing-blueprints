#
# Pipeline CI escalonado por radio de impacto AST (Graphify):
# - PRs: planeamiento AST + suites blueprint no cubiertas por qa-11x-ci.yml (cero duplicación D12).
# - Nocturno / Manual: regresión completa 11X multi-stack + certificación 10/10.

name: QA 11X Tiered CI by AST Blast Radius

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blast-radius-plan:
    name: Compute AST Blast Radius Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      graph: ${{ steps.plan.outputs.graph }}
      run_frontend: ${{ steps.plan.outputs.run_frontend }}
      run_mobile: ${{ steps.plan.outputs.run_mobile }}
      run_backend: ${{ steps.plan.outputs.run_backend }}
      run_full_regression: ${{ steps.plan.outputs.run_full_regression }}

    steps:
      - name: Checkout repository with history for PR diff
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Graphify AST graph
        id: cache-graph
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: graphify-out
          key: ${{ runner.os }}-graphify-${{ hashFiles('**/*.py', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.vue', '**/*.php', '**/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-graphify-

      - name: Compute AST graph and tiered test plan in ephemeral Docker (Rule Zero)
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          CACHE_HIT: ${{ steps.cache-graph.outputs.cache-hit }}
        run: |
          set -euo pipefail
          CI_TMP_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/qa-11x-tiered-$$.XXXXXX")"
          cleanup_tmp() {
            rm -rf "${CI_TMP_DIR}" 2>/dev/null || true
          }
          trap cleanup_tmp EXIT

          : > "${CI_TMP_DIR}/changed_files.txt"
          : > "${CI_TMP_DIR}/blast_outputs.txt"

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ -n "${BASE_SHA}" ] && [ -n "${HEAD_SHA}" ]; then
              git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${CI_TMP_DIR}/changed_files.txt" 2>/dev/null ||
                git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${CI_TMP_DIR}/changed_files.txt"
            elif [ -n "${BASE_REF}" ]; then
              if [[ ! "${BASE_REF}" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]] || [[ "${BASE_REF}" == *".."* ]]; then
                echo "::error::Invalid BASE_REF '${BASE_REF}'." >&2
                exit 1
              fi
              git diff --name-only "origin/${BASE_REF}...HEAD" > "${CI_TMP_DIR}/changed_files.txt"
            fi
          fi

          if [ "${CACHE_HIT}" != "true" ] || [ ! -s "graphify-out/graph.json" ]; then
            if ! docker run --rm --network none \
              -u "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e OLLAMA_BASE_URL="" \
              -v "$(pwd):/app" \
              -w /app \
              sinfallas/remote-graphify@sha256:08aa6a6fc5e72f25bb6a37da632932fe295ba0d72fd971ae5b365eeea3f778b0 \
              sh -c "graphify extract . --code-only && graphify cluster-only ."; then
              echo "::warning::Graphify AST extraction failed; continuing with prefix fallback." >&2
            fi
          fi

          GRAPH_STATUS="SKIPPED"
          if [ -s "graphify-out/graph.json" ]; then
            GRAPH_STATUS="PASS"
          else
            echo "::warning::[graph=SKIPPED] graphify-out/graph.json unavailable; blast selector using prefix fallback." >&2
          fi

          SELECT_ARGS=(
            --event "${EVENT_NAME}"
            --changed-files-file /ci-tmp/changed_files.txt
            --graph graphify-out/graph.json
            --github-output /ci-tmp/blast_outputs.txt
          )
          if [ -n "${BASE_REF:-}" ] && git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            SELECT_ARGS+=(--base-ref "origin/${BASE_REF}")
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            SELECT_ARGS+=(--base-ref "HEAD~1")
          fi

          docker run --rm --network none \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$(pwd):/app:ro" \
            -v "${CI_TMP_DIR}:/ci-tmp" \
            -w /app \
            sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 \
            python3 .agents/scripts/select_tests_by_blast_radius.py "${SELECT_ARGS[@]}"

          printf 'graph=%s\n' "${GRAPH_STATUS}" >> "${GITHUB_OUTPUT}"
          cat "${CI_TMP_DIR}/blast_outputs.txt" >> "${GITHUB_OUTPUT}"

  targeted-frontend-qa:
    name: Targeted Frontend & Mobile Blueprints QA
    needs:
      - blast-radius-plan
    if: >-
      github.event_name == 'pull_request' &&
      (needs.blast-radius-plan.outputs.run_frontend == 'true' ||
       needs.blast-radius-plan.outputs.run_mobile == 'true' ||
       needs.blast-radius-plan.outputs.run_full_regression == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Execute frontend Screenplay blueprints (Rule Zero)
        if: needs.blast-radius-plan.outputs.run_frontend == 'true' || needs.blast-radius-plan.outputs.run_full_regression == 'true'
        run: make test-frontend-blueprints

      - name: Execute mobile Screenplay blueprints (Rule Zero)
        if: needs.blast-radius-plan.outputs.run_mobile == 'true' || needs.blast-radius-plan.outputs.run_full_regression == 'true'
        run: make test-mobile-blueprints

  targeted-backend-and-ai-qa:
    name: Targeted Backend Contracts Blueprints QA
    needs:
      - blast-radius-plan
    if: >-
      github.event_name == 'pull_request' &&
      (needs.blast-radius-plan.outputs.run_backend == 'true' ||
       needs.blast-radius-plan.outputs.run_full_regression == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run targeted backend contract and load blueprints (Rule Zero)
        run: make test-backend-blueprints

  nightly-full-regression:
    name: Full Regression & 10-Stage Certification (Nightly / Manual)
    needs:
      - blast-radius-plan
    if: github.event_name != 'pull_request' && needs.blast-radius-plan.outputs.run_full_regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run full 11X QA regression and certification
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          make test
          DIFF_ARGS=(--workspace /app --reports-dir .agents/.cache/coverage)
          if [ -n "${BASE_REF:-}" ] && git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            DIFF_ARGS+=(--base-ref "origin/${BASE_REF}")
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            DIFF_ARGS+=(--base-ref "HEAD~1")
          fi
          docker run --rm --network none \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$(pwd):/app:ro" \
            -w /app \
            sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 \
            python3 .agents/scripts/verify_diff_coverage.py "${DIFF_ARGS[@]}"
          make certify
