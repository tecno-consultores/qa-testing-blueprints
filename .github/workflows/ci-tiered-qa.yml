#
# Pipeline CI escalonado por radio de impacto AST (Graphify): PR acotado vs regresión nocturna.

name: QA 11X Tiered CI by AST Blast Radius

on:
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blast-radius-plan:
    name: Compute AST Blast Radius Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      run_frontend: ${{ steps.plan.outputs.run_frontend }}
      run_backend: ${{ steps.plan.outputs.run_backend }}
      run_mcp: ${{ steps.plan.outputs.run_mcp }}
      run_ai_offline: ${{ steps.plan.outputs.run_ai_offline }}
      run_meta_qa: ${{ steps.plan.outputs.run_meta_qa }}
      validate_calm: ${{ steps.plan.outputs.validate_calm }}
      run_full_regression: ${{ steps.plan.outputs.run_full_regression }}
      estimated_savings_pct: ${{ steps.plan.outputs.estimated_savings_pct }}

    steps:
      - name: Checkout repository with history for PR diff
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute tiered test plan in ephemeral Python container (Rule Zero)
        id: plan
        run: |
          : > "${RUNNER_TEMP}/changed_files.txt"
          : > "${RUNNER_TEMP}/blast_outputs.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if [ -n "${BASE_SHA}" ] && [ -n "${HEAD_SHA}" ]; then
              git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/changed_files.txt"
            else
              git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "${RUNNER_TEMP}/changed_files.txt"
            fi
          fi
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$(pwd):/app:ro" \
            -v "${RUNNER_TEMP}:/ci-tmp" \
            -w /app \
            sinfallas/base-python-uv:3.15 \
            python3 .agents/scripts/select_tests_by_blast_radius.py \
              --event "${{ github.event_name }}" \
              --changed-files-file /ci-tmp/changed_files.txt \
              --graph graphify-out/graph.json \
              --github-output /ci-tmp/blast_outputs.txt
          cat "${RUNNER_TEMP}/blast_outputs.txt" >> "${GITHUB_OUTPUT}"

  docs-and-calm-fast-gate:
    name: Docs Invariants & Conditional CALM Gate
    needs:
      - blast-radius-plan
    if: needs.blast-radius-plan.outputs.run_full_regression != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify documentation invariants and git gate
        run: make lint-docs

      - name: Validate FINOS CALM architecture when MCP or architecture changes
        if: needs.blast-radius-plan.outputs.validate_calm == 'true'
        run: make validate-calm

  targeted-frontend-qa:
    name: Targeted Frontend Screenplay & Anti-Pattern QA
    needs:
      - blast-radius-plan
    if: >-
      needs.blast-radius-plan.outputs.run_full_regression != 'true' &&
      needs.blast-radius-plan.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Execute frontend Screenplay TS and antipattern linter (Rule Zero)
        run: make test-frontend-blueprints

  targeted-mcp-and-meta-qa:
    name: Targeted MCP, Meta-QA & AI Offline Suites
    needs:
      - blast-radius-plan
    if: >-
      needs.blast-radius-plan.outputs.run_full_regression != 'true' &&
      (needs.blast-radius-plan.outputs.run_mcp == 'true' ||
       needs.blast-radius-plan.outputs.run_meta_qa == 'true' ||
       needs.blast-radius-plan.outputs.run_ai_offline == 'true' ||
       needs.blast-radius-plan.outputs.run_backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run targeted MCP lint and unit suite
        if: needs.blast-radius-plan.outputs.run_mcp == 'true'
        run: make lint && make test-mcp

      - name: Run Meta-QA governance and linter suites
        if: needs.blast-radius-plan.outputs.run_meta_qa == 'true' || needs.blast-radius-plan.outputs.run_backend == 'true'
        run: make test-meta-qa && make test-py

      - name: Run offline AI evaluation contracts
        if: needs.blast-radius-plan.outputs.run_ai_offline == 'true'
        run: make test-ai-offline

  nightly-full-regression:
    name: Full Regression & 10-Stage Certification (Nightly / High Blast)
    needs:
      - blast-radius-plan
    if: needs.blast-radius-plan.outputs.run_full_regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Run full 11X QA regression and certification
        run: >-
          make test-frontend-blueprints &&
          make test-meta-qa &&
          make test-ai-offline &&
          make test-py &&
          make lint &&
          make test-mcp &&
          make validate-calm &&
          make lint-workflows &&
          make lint-docs &&
          make certify
