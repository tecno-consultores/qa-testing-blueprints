name: QA 11X Certification & MCP Server CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  certify-11x-and-mcp-qa:
    name: Gate 10/10 & Ephemeral Docker QA (Rule Zero)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflows, docs, version & CALM architecture
        run: make lint-workflows && make lint-docs && make version-check && make validate-calm

      - name: Execute Bash ShellCheck, shfmt & BATS suites
        run: make shellcheck && make shfmt && make test-bats

      - name: Execute Python unit & Meta-QA governance suites
        run: make test-py && make test-meta-qa

      - name: Execute offline AI & skill adherence contracts
        run: make test-ai-offline

      - name: Execute MCP Server lint, build, unit & clean-room example E2E
        run: make lint && make build && make test-mcp && make test-example

      - name: Execute Karate Labs BDD contract suite
        run: make test-karate

      - name: Cache Graphify AST graph
        id: cache-graph
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            graphify-out
            */graphify-out
          key: ${{ runner.os }}-graphify-${{ hashFiles('**/*.py', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.vue', '**/*.php', '**/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-graphify-

      - name: Refresh Graphify AST graph for Gate 6 (Rule Zero)
        if: steps.cache-graph.outputs.cache-hit != 'true'
        run: ./scripts/actualizar-grafos-graphify.sh --all

      - name: Verify differential coverage & 10-stage certification gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          DIFF_ARGS=(--workspace /app --reports-dir .agents/.cache/coverage)
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ] && git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            DIFF_ARGS+=(--base-ref "origin/${BASE_REF}")
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            DIFF_ARGS+=(--base-ref "HEAD~1")
          fi
          docker run --rm --network none \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$(pwd):/app:ro" \
            -w /app \
            sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 \
            python3 .agents/scripts/verify_diff_coverage.py "${DIFF_ARGS[@]}"
          make certify
