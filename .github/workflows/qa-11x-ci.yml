name: QA 11X Certification & MCP Server CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  certify-11x-and-mcp-qa:
    name: Gate 10/10 & Ephemeral Docker QA (Rule Zero)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Execute Python Governance Validators & Unit Suite in Ephemeral Docker (Rule Zero)
        run: |
          docker run --rm \
            -e COVERAGE_FILE=/tmp/.coverage \
            -e UV_CACHE_DIR=/tmp/uv-cache \
            -e RUFF_CACHE_DIR=/tmp/ruff-cache \
            -e HOME=/tmp \
            -u "$(id -u):$(id -g)" \
            -v "$(pwd):/app" \
            -w /app \
            sinfallas/base-python-uv:3.15 \
            bash -c "python3 scripts/generar-manifiesto.py --check && \
              python3 .agents/scripts/sync_governance.py --check && \
              python3 .agents/scripts/verify_docs_invariants.py && \
              python3 .agents/scripts/verify_roadmap_consistency.py && \
              python3 .agents/scripts/verify_topological_health.py && \
              python3 .agents/scripts/verify_json_no_duplicate_keys.py && \
              ruff check tests/meta_qa .agents/scripts/release_readiness_gate.py && \
              uv run --with pytest --with pytest-cov pytest -o cache_dir=/tmp/pytest-cache --import-mode=importlib tests/*.unit.py tests/meta_qa/test_governance_scripts.py -q"

      - name: Execute MCP Server QA Suite in Ephemeral Docker (Rule Zero)
        run: |
          docker compose -f mcp-server/docker-compose.qa.yml run --rm -u "$(id -u):$(id -g)" mcp-server bash -c \
            "pnpm install --frozen-lockfile && pnpm run lint && pnpm run typecheck && pnpm run test:unit && pnpm run build && pnpm run test:example && rm -rf coverage .eslintcache"

      - name: Execute Karate Labs BDD Contract Suite in Ephemeral Docker (Rule Zero)
        run: |
          docker run --rm \
            -v "$(pwd)/mcp-server/test:/app/src/test/java/examples/test:ro" \
            -v "$(pwd):/repo:ro" \
            sinfallas/karatelabs:1.5.1 mvn -B clean test

      - name: Execute Bash Scripts BATS & ShellCheck in Ephemeral Docker (Rule Zero)
        run: |
          docker run --rm \
            -v "$(pwd):/repo:ro" \
            -w /repo/bash-scripts \
            sinfallas/base-bash-qa:latest \
            bash -c "shellcheck -x ../scripts/*.sh ../.agents/scripts/*.sh ../instalar-hooks.sh ./*.sh && bats test/*.bats ../tests/bats/*.bats"

      - name: Validate FINOS CALM Architecture in Ephemeral Docker (Rule Zero)
        run: bash ./.agents/scripts/validate_calm_architecture.sh

      - name: Run 10-Stage Certification Gate
        run: bash ./.agents/scripts/certify_task_completion.sh
