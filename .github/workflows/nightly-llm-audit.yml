#
# Workflow nocturno y de PRs para contratos offline de IA/skills y auditoría live multi-modelo.

name: QA 11X Nightly LLM & Skills Adherence Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/evals/**'
      - 'ai-evals/**'
      - '.agents/skills/**'
      - 'AI_MASTER_PROMPT.md'
      - '.github/workflows/nightly-llm-audit.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-ai-and-skills-contracts:
    name: Deterministic Offline AI & Skills Contracts (Rule Zero)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run offline AI and skills contracts in ephemeral Docker
        run: make test-ai-offline

  nightly-live-llm-matrix:
    name: Nightly Live DeepEval & Promptfoo Matrix
    if: github.event_name != 'pull_request'
    needs:
      - offline-ai-and-skills-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run live DeepEval and Promptfoo matrix when credentials exist
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          PROMPTFOO_DISABLE_TELEMETRY: '1'
        run: |
          if [ -z "${OPENAI_API_KEY:-}${GEMINI_API_KEY:-}${ANTHROPIC_API_KEY:-}${OLLAMA_BASE_URL:-}" ]; then
            echo "⚠️ SKIPPED_NO_LLM_SECRETS_CONFIGURED: Sin secretos LLM ni endpoint OLLAMA_BASE_URL activo."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## ⚠️ Live LLM Matrix — SKIPPED"
                echo ""
                echo "- Estado: \`SKIPPED_NO_LLM_SECRETS_CONFIGURED\`"
                echo "- Motivo: No se configuraron credenciales de proveedor cloud ni \`OLLAMA_BASE_URL\`."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
            exit 0
          fi
          make audit-llm
