# ==============================================================================
# ORQUESTADOR QA TESTING BLUEPRINTS - NODE.JS (NIVEL 11X)
# ==============================================================================
services:
  # 1. LA APLICACIÓN REAL: Servidor Node en segundo plano para Karate, Artillery, Clinic y ZAP
  api:
    image: sinfallas/base-node-ionic:latest
    container_name: node_api
    hostname: api
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
      PORT: 3000
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    # Privilegios críticos para que el Kernel permita leer la memoria (Clinic.js / perf)
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "pnpm install && pnpm run dev"

  # 2. ENTORNO DE PRUEBAS INTERNAS: Para Vitest, Supertest, ESLint, Stryker y Clinic
  test:
    image: sinfallas/base-node-ionic:latest
    container_name: node_test
    hostname: test_env
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
    volumes:
      - .:/app
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "echo 'Contenedor Node E2E listo. Usa docker compose run --rm test [comando]'; sleep infinity"

  # 3. ENTORNO BDD: Karate Labs automatizando pruebas de caja negra
  karatelabs:
    image: sinfallas/karatelabs:latest
    container_name: node_karate
    pull_policy: always
    depends_on:
      - api
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn clean test'; sleep infinity"

  # 4. ENTORNO DAST: OWASP ZAP para seguridad dinámica
  zap:
    image: owasp/zap2docker-stable:latest
    container_name: node_zap
    pull_policy: always
    depends_on:
      - api
    # Se utiliza el usuario root temporalmente para evitar problemas de permisos al escribir el reporte HTML en el volumen del host
    user: root 
    volumes:
      - .:/zap/wrk/:rw
    command: bash -c "echo 'Contenedor ZAP listo. Usa docker compose run --rm zap zap-baseline.py -t http://api:3000 -r zap-report.html'; sleep infinity"

  # ============================================================================
  # PERFIL DE CAOS (Solo se activa explícitamente con --profile chaos)
  # ============================================================================

  # 5. EL ATACANTE DE INFRAESTRUCTURA: Pumba
  pumba:
    image: gaiaadm/pumba:latest
    container_name: node_pumba
    profiles:
      - chaos
    volumes:
      # ADVERTENCIA: Montaje del socket de Docker. Exclusivo para Chaos Engineering.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    # Inyecta 500ms de latencia de red (+- 50ms de jitter aleatorio) al contenedor 'node_api' durante 1 minuto
    command: netem --tc-image gaiadocker/iproute2 --duration 1m delay --time 500 --jitter 50 re2:^node_api$

  # 6. EL INYECTOR DE CARGA: Artillery (Estrés Concurrente bajo Caos)
  stress_test:
    image: sinfallas/base-node-ionic:latest
    container_name: node_chaos_artillery
    profiles:
      - chaos
    depends_on:
      - api
    volumes:
      - .:/app
    # Genera oleadas de carga con Artillery mientras Pumba ralentiza la red
    command: bash -c "pnpm install && echo 'Esperando asimilación del caos...' && sleep 5 && pnpm run test:load -- --output chaos-report.json"

  # ============================================================================
  # PERFIL DE CONTEXTO IA (Solo se activa explícitamente con --profile graphify)
  # ============================================================================
  graphify:
    image: sinfallas/remote-graphify:latest
    # El container_name se ajusta según el ecosistema (ej. node_graphify, fastapi_graphify)
    container_name: fastapi_graphify
    hostname: graphify
    profiles:
      - graphify
    # Mantiene el servidor vivo para que el agente lo consulte múltiples veces
    restart: always
    command: uvx --from graphifyy python -m graphify.serve /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Configuración local para OmniRoute o Llama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
      # Modelos Cloud (Descomentar e inyectar vía .env si se requiere)
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - ANTHROPIC_MODEL=claude-3-5-sonnet-latest
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      # - OPENAI_MODEL=gpt-4o-mini
    volumes:
      - .:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

# ============================================================================
# REDES AISLADAS (Sobrescribe la red por defecto unificando todo el entorno)
# ============================================================================
networks:
  default:
    driver: bridge
