services:
  api:
    image: sinfallas/base-node-ionic:latest
    container_name: node_api
    hostname: api
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
      PORT: 3000
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "pnpm install && pnpm run dev"

  test:
    image: sinfallas/base-node-ionic:latest
    container_name: node_test
    hostname: test_env
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
    volumes:
      - .:/app
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "echo 'Contenedor Node E2E listo. Usa docker compose run --rm test [comando]'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:latest
    container_name: node_karate
    pull_policy: always
    depends_on:
      - api
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn clean test'; sleep infinity"

  zap:
    image: owasp/zap2docker-stable:latest
    container_name: node_zap
    pull_policy: always
    depends_on:
      - api
    user: root 
    volumes:
      - .:/zap/wrk/:rw
    command: bash -c "echo 'Contenedor ZAP listo. Usa docker compose run --rm zap zap-baseline.py -t http://api:3000 -r zap-report.html'; sleep infinity"

  pumba:
    image: gaiaadm/pumba:latest
    container_name: node_pumba
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    command: netem --tc-image gaiadocker/iproute2 --duration 1m delay --time 500 --jitter 50 re2:^node_api$

  prometheus:
    image: prom/prometheus:latest
    container_name: node_prometheus
    profiles:
      - chaos
    # Inyección de configuración inline (raspa la API de Node cada 2s para ver el impacto de Pumba)
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'node_qa'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['api:3000']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  stress_test:
    image: sinfallas/base-node-ionic:latest
    container_name: node_chaos_artillery
    profiles:
      - chaos
    depends_on:
      - api
    volumes:
      - .:/app
    command: bash -c "pnpm install && echo 'Esperando asimilación del caos...' && sleep 5 && pnpm run test:load -- --output chaos-report.json"

  graphify:
    image: sinfallas/remote-graphify:latest
    container_name: node_graphify
    hostname: graphify
    profiles:
      - graphify
    restart: always
    command: uvx --from graphifyy python -m graphify.serve /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Configuración local para OmniRoute o Llama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
    volumes:
      - .:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  default:
    driver: bridge
