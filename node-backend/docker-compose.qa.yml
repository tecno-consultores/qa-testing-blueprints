services:
  # 1. LA APLICACIÓN REAL: Servidor Node en segundo plano para Karate, Artillery, Clinic y ZAP
  api:
    image: sinfallas/base-node-ionic:latest
    container_name: node_api
    hostname: api
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
      PORT: 3000
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    # Privilegios críticos para que el Kernel permita leer la memoria (Clinic.js / perf)
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "pnpm install && pnpm run dev"

  # 2. ENTORNO DE PRUEBAS INTERNAS: Para Vitest, Supertest, ESLint, Stryker y Clinic
  test:
    image: sinfallas/base-node-ionic:latest
    container_name: node_test
    hostname: test_env
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
    volumes:
      - .:/app
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "echo 'Contenedor Node E2E listo. Usa docker compose run --rm test [comando]'; sleep infinity"

  # 3. ENTORNO BDD: Karate Labs automatizando pruebas de caja negra
  karatelabs:
    image: sinfallas/karatelabs:latest
    container_name: node_karate
    pull_policy: always
    depends_on:
      - api
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn clean test'; sleep infinity"

  # 4. ENTORNO DAST: OWASP ZAP para seguridad dinámica
  zap:
    image: owasp/zap2docker-stable:latest
    container_name: node_zap
    pull_policy: always
    depends_on:
      - api
    # Se utiliza el usuario root temporalmente para evitar problemas de permisos al escribir el reporte HTML en el volumen del host
    user: root 
    volumes:
      - .:/zap/wrk/:rw
    command: bash -c "echo 'Contenedor ZAP listo. Usa docker compose run --rm zap zap-baseline.py -t http://api:3000 -r zap-report.html'; sleep infinity"
