services:
  pnpm-store-init:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    pull_policy: if_not_present
    mem_limit: 256m
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - pnpm-store:/pnpm
    command: ["chmod", "-R", "a+rwX", "/pnpm"]

  api:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    container_name: node_api
    hostname: node_api
    pull_policy: if_not_present
    mem_limit: 2g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    environment:
      TZ: 'America/Caracas'
      PORT: 3000
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
      pnpm_config_manage_package_manager_versions: 'false'
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: bash -c "pnpm install && pnpm run dev"

  qa-node-backend:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    container_name: node_qa_backend
    hostname: node_qa_backend
    pull_policy: if_not_present
    mem_limit: 4g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
      pnpm_config_manage_package_manager_versions: 'false'
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Node listo para Lint, Unit, BDD y Mutación. Usa docker compose run --rm -T qa-node-backend [comando]'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:1.5.1@sha256:a9a52ca9c5491ab39b64f0b4fdc3dea879c2213c9bc995be58d6cd4b9a80cc89
    container_name: node_karate
    hostname: node_karate
    pull_policy: if_not_present
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://api:3000
    volumes:
      - ./test:/app/src/test/java/examples/test:ro
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm -T karatelabs mvn clean test'; sleep infinity"

  zap:
    image: zaproxy/zap-stable:2.15.0@sha256:8dc78e39fafc3281ac2cf54eab05c3ea02721a1ea58f1c135f981a57f4e218b1
    container_name: node_zap
    hostname: node_zap
    pull_policy: if_not_present
    mem_limit: 2g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/zap/wrk:ro
    command: bash -c "echo 'Contenedor ZAP listo. Usa docker compose run --rm -T zap zap-baseline.py -t http://api:3000 -r /tmp/zap-report.html'; sleep infinity"

  pumba:
    image: gaiaadm/pumba:0.10.1@sha256:07f89803f5ce89d2ae0bf0b67d0fc3e094324626afd2e2402bcd9dc62ff409f5
    container_name: node_pumba
    hostname: node_pumba
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      api:
        condition: service_healthy
    command: netem --tc-image gaiadocker/iproute2@sha256:d0cd5819fbeaf2e7501dcb223bb5bad4fda7c1e76ff9877baba6e559c70b6d1e --duration 1m delay --time 500 --jitter 50 re2:^/?node_api$|.*[-_]api[-_][0-9]+$

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: node_prometheus
    hostname: node_prometheus
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
      - observability
    # Inyección de configuración inline (raspa la API de Node cada 2s para ver el impacto de Pumba)
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'node_qa'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['api:3000']
        " > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  stress_test:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    container_name: node_chaos_artillery
    hostname: node_chaos_artillery
    pull_policy: if_not_present
    mem_limit: 2g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
      pnpm_config_manage_package_manager_versions: 'false'
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "pnpm install && echo 'Esperando asimilación del caos...' && sleep 5 && pnpm run test:load -- --output chaos-report.json"

networks:
  default:
    driver: bridge

volumes:
  pnpm-store:
    name: node_backend_pnpm_store_cache
