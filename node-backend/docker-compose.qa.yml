services:
  pnpm-store-init:
    image: sinfallas/base-node-ionic:26
    pull_policy: if_not_present
    user: "0:0"
    volumes:
      - pnpm-store:/pnpm
    command: ["chmod", "-R", "a+rwX", "/pnpm"]

  api:
    image: sinfallas/base-node-ionic:26
    container_name: node_api
    hostname: node_api
    pull_policy: if_not_present
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    environment:
      TZ: 'America/Caracas'
      PORT: 3000
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: bash -c "pnpm install && pnpm run dev"

  qa-node-backend:
    image: sinfallas/base-node-ionic:26
    container_name: node_qa_backend
    hostname: node_qa_backend
    pull_policy: if_not_present
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "echo 'Contenedor QA Node listo para Lint, Unit, BDD y Mutación. Usa docker compose run --rm qa-node-backend [comando]'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:1.5.1
    container_name: node_karate
    hostname: node_karate
    pull_policy: if_not_present
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn clean test'; sleep infinity"

  zap:
    image: zaproxy/zap-stable:2.15.0
    container_name: node_zap
    hostname: node_zap
    pull_policy: if_not_present
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/zap/wrk/:rw
    command: bash -c "echo 'Contenedor ZAP listo. Usa docker compose run --rm zap zap-baseline.py -t http://api:3000 -r zap-report.html'; sleep infinity"

  pumba:
    image: gaiaadm/pumba:0.10.1
    container_name: node_pumba
    hostname: node_pumba
    pull_policy: if_not_present
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      api:
        condition: service_healthy
    command: netem --tc-image gaiadocker/iproute2 --duration 1m delay --time 500 --jitter 50 re2:^node_api$

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: node_prometheus
    hostname: node_prometheus
    pull_policy: if_not_present
    profiles:
      - chaos
    # Inyección de configuración inline (raspa la API de Node cada 2s para ver el impacto de Pumba)
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'node_qa'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['api:3000']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  stress_test:
    image: sinfallas/base-node-ionic:26
    container_name: node_chaos_artillery
    hostname: node_chaos_artillery
    pull_policy: if_not_present
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    profiles:
      - chaos
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "pnpm install && echo 'Esperando asimilación del caos...' && sleep 5 && pnpm run test:load -- --output chaos-report.json"

networks:
  default:
    driver: bridge

volumes:
  pnpm-store:
    name: node_backend_pnpm_store_cache
