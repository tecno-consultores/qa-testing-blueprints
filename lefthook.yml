# ==============================================================================
# LEFTHOOK - BARRERA DE ENTRADA (Pre-commit, Commit-msg & Pre-push)
# ==============================================================================
# Esta configuración intercepta los comandos de Git y obliga a ejecutar validaciones
# efímeras en Docker ANTES de permitir que el código entre al historial de Git
# o sea enviado al repositorio remoto.

pre-commit:
  parallel: true
  commands:
    # --------------------------------------------------------------------------
    # ECOSISTEMA PYTHON & FASTAPI
    # --------------------------------------------------------------------------
    fastapi-lint:
      root: "fastapi/"
      glob: "*.py"
      run: bash -c 'if [ ! -f docker-compose.qa.yml ] || [ ! -f pyproject.toml ]; then exit 0; fi; docker compose -f docker-compose.qa.yml run --rm -T qa-backend bash -c "uv pip install --system -e '\''.[dev]'\'' -q && ruff check {staged_files} && ruff format --check {staged_files}"'

    python-lint:
      root: "python/"
      glob: "*.py"
      run: bash -c 'if [ ! -f docker-compose.qa.yml ] || [ ! -f pyproject.toml ]; then exit 0; fi; docker compose -f docker-compose.qa.yml run --rm -T qa-backend bash -c "uv pip install --system -e '\''.[dev]'\'' -q && ruff check {staged_files} && ruff format --check {staged_files}"'

    # --------------------------------------------------------------------------
    # ECOSISTEMA JAVASCRIPT (NODE, VUE3 & REACT)
    # --------------------------------------------------------------------------
    vue3-lint:
      root: "vue3/"
      glob: "*.{js,ts,vue}"
      run: bash -c 'if [ ! -f docker-compose.qa.yml ] || [ ! -f package.json ]; then exit 0; fi; docker compose -f docker-compose.qa.yml run --rm -T -u "$(id -u):$(id -g)" qa-frontend bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"'

    react-lint:
      root: "react-frontend/"
      glob: "*.{js,ts,tsx}"
      run: bash -c 'if [ ! -f docker-compose.qa.yml ] || [ ! -f package.json ]; then exit 0; fi; docker compose -f docker-compose.qa.yml run --rm -T -u "$(id -u):$(id -g)" qa-frontend bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"'

    node-backend-lint:
      root: "node-backend/"
      glob: "*.{js,ts}"
      run: bash -c 'if [ ! -f docker-compose.qa.yml ] || [ ! -f package.json ]; then exit 0; fi; docker compose -f docker-compose.qa.yml run --rm -T -u "$(id -u):$(id -g)" qa-node-backend bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"'

    # --------------------------------------------------------------------------
    # ECOSISTEMA PHP 8.2-8.5
    # --------------------------------------------------------------------------
    php-lint:
      root: "php/"
      glob: "*.php"
      run: bash -c 'if [ ! -f docker-compose.qa.yml ] || [ ! -f composer.json ]; then exit 0; fi; docker compose -f docker-compose.qa.yml run --rm -T -u "$(id -u):$(id -g)" qa-php composer --quiet run-script qa:lint'

    # --------------------------------------------------------------------------
    # ECOSISTEMA BASH (DEVOPS)
    # --------------------------------------------------------------------------
    bash-lint:
      root: "bash-scripts/"
      glob: "*.sh"
      # ShellCheck evalúa vulnerabilidades POSIX, shfmt -i 2 -ci -d verifica el formato canónico en modo check
      run: docker compose -f docker-compose.qa.yml run --rm -T -u "$(id -u):$(id -g)" qa-bash bash -c "shellcheck -x {staged_files} && shfmt -i 2 -ci -d {staged_files}"

    repo-bash-lint:
      glob: "{scripts/*.sh,.agents/scripts/*.sh,instalar-hooks.sh,*/limpieza.sh,mcp-server/example/verify-v2.sh}"
      run: docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/repo:ro" -w /repo sinfallas/base-bash-qa@sha256:2d1f579e20ef384e85da839304dbae2d28231fcdc893c21cbe79861b44d675a7 bash -c 'shellcheck -x "$@" && shfmt -i 2 -ci -d "$@"' _ {staged_files}

    # --------------------------------------------------------------------------
    # PROTECCIÓN DE SECRETOS (Global, deduplicado sobre staged)
    # --------------------------------------------------------------------------
    secret-scan:
      glob: "**/*"
      # Ejecuta el escáner corporativo unificado (entropía, llaves privadas, tokens y .env)
      run: ./scripts/verificar-secretos.sh {staged_files}

    # --------------------------------------------------------------------------
    # GOBERNANZA ZERO-LLM E INVARIANTES DOCUMENTALES (QA-11X v3.1)
    # --------------------------------------------------------------------------
    governance-sync-check:
      glob: "{manifest.json,AGENTS.md,lefthook.yml,.trivy.yaml,.env.example,llms.txt,catalogs/**,mcp-server/package.json,*.md,**/*.md,.agents/**,docs/**,scripts/*.sh,**/*.example,**/docker-compose.qa.yml,**/limpieza.sh,fastapi/**,python/**,node-backend/**,vue3/**,react-frontend/**,php/**,bash-scripts/**,mobile-appium/**,ai-evals/**,vibe-rescue/**}"
      run: docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -v "$(pwd):/app:ro" -w /app sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 python3 .agents/scripts/sync_governance.py --check

    docs-invariants:
      glob: "{*.md,**/*.md,manifest.json,.agents/*,.agents/**/*}"
      run: docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -v "$(pwd):/app:ro" -w /app sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 python3 .agents/scripts/verify_docs_invariants.py

commit-msg:
  commands:
    # --------------------------------------------------------------------------
    # AUDITORÍA DE CONVENCIONES DE GIT (Fuente Única de Verdad — Rule Zero POSIX)
    # --------------------------------------------------------------------------
    conventional-commits:
      # Valida Conventional Commits en Bash puro (<= 100 caracteres, sin commitlint.config.js)
      run: |-
        bash -c 'first_line=$(head -n 1 "{1}"); printf "%s\n" "$first_line" | grep -Eq "^(Merge |Revert \")" || printf "%s\n" "$first_line" | grep -Eq "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([a-z0-9._/-]+\))?!?: .{1,100}$" || { echo "❌ [Conventional Commits] Formato requerido (<= 100 chars): ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([a-z0-9._/-]+\))?!?: .{1,100}$" >&2; exit 1; }'

pre-push:
  commands:
    # --------------------------------------------------------------------------
    # AUDITORÍA DE INFRAESTRUCTURA (IaC), E2E MCP, KARATE BDD, PYTHON Y BASH (1:1 CI)
    # --------------------------------------------------------------------------
    trivy-iac-scan:
      # Bloquea el `git push` si hay puertos expuestos, contenedores en modo root
      # o vulnerabilidades críticas en dependencias (File System).
      run: ./scripts/auditar-infra.sh

    mcp-example-smoke:
      glob: "{mcp-server/**,manifest.json}"
      run: ./scripts/probar-mcp-example.sh --in-place

    mcp-unit-and-lint:
      glob: "{mcp-server/**,manifest.json}"
      run: bash -c '[ ! -f mcp-server/package.json ] && exit 0; MCP_EXTRA_VOLS=(); for dir in mobile-appium vibe-rescue .github; do [ -d "./${dir}" ] && MCP_EXTRA_VOLS+=(-v "$(pwd)/${dir}:/${dir}:ro"); done; docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e PNPM_HOME=/tmp/pnpm -e pnpm_config_store_dir=/tmp/.pnpm-store -v "$(pwd)/mcp-server:/app" ${MCP_EXTRA_VOLS[@]+"${MCP_EXTRA_VOLS[@]}"} -w /app sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60 bash -c "pnpm install --frozen-lockfile --prefer-offline --trust-lockfile --silent && pnpm --silent run lint && pnpm --silent run typecheck && pnpm --silent run test:unit && rm -rf coverage .eslintcache"'

    python-governance-and-meta-qa:
      # Ejecuta tests/*.unit.py y tests/meta_qa/test_governance_scripts.py (más test_antipattern_linter.py) vía make test-py && make test-meta-qa
      run: bash -c '[ ! -f scripts/generar-manifiesto.py ] && exit 0; docker run --rm --network none -e COVERAGE_FILE=/tmp/.coverage -e UV_CACHE_DIR=/tmp/uv-cache -e RUFF_CACHE_DIR=/tmp/ruff-cache -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/app/.agents/scripts -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/app:ro" -w /app sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 bash -c "python3 .agents/scripts/sync_governance.py --check && python3 .agents/scripts/bump_version_11x.py --workspace . --check && python3 .agents/scripts/verify_docs_invariants.py && python3 .agents/scripts/verify_roadmap_consistency.py && python3 .agents/scripts/verify_topological_health.py && python3 .agents/scripts/verify_json_no_duplicate_keys.py" && if command -v make >/dev/null 2>&1; then make test-py && make test-meta-qa; else docker run --rm --network none -e COVERAGE_FILE=/tmp/.coverage -e UV_CACHE_DIR=/tmp/uv-cache -e RUFF_CACHE_DIR=/tmp/ruff-cache -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/app/.agents/scripts:/app/vibe-rescue:/app -e HOME=/tmp -u "$(id -u):$(id -g)" -v "$(pwd):/app:ro" -w /app sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4 bash -c "ruff check --select E,F,W,I,UP,B,C901,FLY --config '\''lint.mccabe.max-complexity=5'\'' .agents/scripts scripts tests vibe-rescue && MYPYPATH=/app/.agents/scripts:ai-evals:vibe-rescue mypy --strict --cache-dir=/tmp/mypy .agents/scripts/*.py scripts/*.py tests/*.unit.py tests/meta_qa/*.py tests/evals/*.py vibe-rescue/*.py vibe-rescue/tests/*.py && pytest --cov=.agents/scripts --cov=scripts --cov=vibe-rescue --cov-fail-under=95 --cov-branch tests/*.unit.py tests/meta_qa/test_*.py vibe-rescue/tests/*.unit.py -q"; fi'

    karate-bdd-contracts:
      glob: "{mcp-server/**,manifest.json,.agents/skills/**}"
      run: bash -c '[ ! -d mcp-server/test ] && exit 0; docker run --rm --network none --security-opt=no-new-privileges:true -v "$(pwd)/mcp-server/test:/app/src/test/java/examples/test:ro" -v "$(pwd):/repo:ro" sinfallas/karatelabs:1.5.1@sha256:a9a52ca9c5491ab39b64f0b4fdc3dea879c2213c9bc995be58d6cd4b9a80cc89 mvn -B -q clean test'

    bash-shellcheck-bats:
      run: bash -c '[ ! -d bash-scripts/test ] && exit 0; docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp -e _USER=qa -v "$(pwd):/repo:ro" -w /repo/bash-scripts sinfallas/base-bash-qa@sha256:2d1f579e20ef384e85da839304dbae2d28231fcdc893c21cbe79861b44d675a7 bash -c "shopt -s nullglob; mapfile -t lint_files < <(printf '\''%s\n'\'' ../scripts/*.sh ../.agents/scripts/*.sh ../instalar-hooks.sh ../*/limpieza.sh ../mcp-server/example/verify-v2.sh ./*.sh | sort -u); shellcheck -x \"\${lint_files[@]}\" && shfmt -i 2 -ci -d \"\${lint_files[@]}\" && bats test/*.bats ../tests/bats/*.bats"'

    calm-architecture-gate:
      run: bash -c '[ ! -x .agents/scripts/validate_calm_architecture.sh ] && exit 0; ./.agents/scripts/validate_calm_architecture.sh'

    certify-11x-gate:
      run: bash -c '[ ! -x .agents/scripts/certify_task_completion.sh ] && exit 0; ./.agents/scripts/certify_task_completion.sh'
