# ==============================================================================
# LEFTHOOK - BARRERA DE ENTRADA (Pre-commit, Commit-msg & Pre-push)
# ==============================================================================
# Esta configuración intercepta los comandos de Git y obliga a ejecutar validaciones
# efímeras en Docker ANTES de permitir que el código entre al historial de Git
# o sea enviado al repositorio remoto.

pre-commit:
  parallel: true
  commands:
    # --------------------------------------------------------------------------
    # ECOSISTEMA PYTHON & FASTAPI
    # --------------------------------------------------------------------------
    fastapi-lint:
      root: "fastapi/"
      glob: "*.py"
      run: docker compose -f docker-compose.qa.yml run --rm qa-backend bash -c "uv pip install --system -e '.[dev]' -q && ruff check {staged_files} && ruff format --check {staged_files}"

    python-lint:
      root: "python/"
      glob: "*.py"
      run: docker compose -f docker-compose.qa.yml run --rm qa-backend bash -c "uv pip install --system -e '.[dev]' -q && ruff check {staged_files} && ruff format --check {staged_files}"

    # --------------------------------------------------------------------------
    # ECOSISTEMA JAVASCRIPT (NODE, VUE3 & REACT)
    # --------------------------------------------------------------------------
    vue3-lint:
      root: "vue3/"
      glob: "*.{js,ts,vue}"
      run: docker compose -f docker-compose.qa.yml run --rm qa-vue3 bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"

    react-lint:
      root: "react-frontend/"
      glob: "*.{js,ts,tsx}"
      run: docker compose -f docker-compose.qa.yml run --rm qa-frontend bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"

    node-backend-lint:
      root: "node-backend/"
      glob: "*.{js,ts}"
      run: docker compose -f docker-compose.qa.yml run --rm qa-node-backend bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"

    # --------------------------------------------------------------------------
    # ECOSISTEMA BASH (DEVOPS)
    # --------------------------------------------------------------------------
    bash-lint:
      root: "bash-scripts/"
      glob: "*.sh"
      # shellCheck evalúa vulnerabilidades POSIX, shfmt verifica la estética (-d es modo dry-run/check)
      run: docker compose -f docker-compose.qa.yml run --rm qa-bash bash -c "shellcheck {staged_files} && shfmt -d {staged_files}"

    # --------------------------------------------------------------------------
    # PROTECCIÓN DE SECRETOS (Global)
    # --------------------------------------------------------------------------
    leaks-check:
      glob: "**/*"
      # Ejecuta el escáner corporativo unificado (entropía, llaves privadas, tokens y .env)
      run: ./scripts/verificar-secretos.sh {staged_files}

commit-msg:
  commands:
    # --------------------------------------------------------------------------
    # AUDITORÍA DE CONVENCIONES DE GIT (Commitlint)
    # --------------------------------------------------------------------------
    conventional-commits:
      # Exige que el mensaje de commit respete el commitlint.config.js
      # Se ejecuta usando npx al vuelo para no requerir instalación global
      run: npx --no-install commitlint --edit {1}

pre-push:
  commands:
    # --------------------------------------------------------------------------
    # AUDITORÍA DE INFRAESTRUCTURA (IaC) ANTES DE SUBIR
    # --------------------------------------------------------------------------
    trivy-iac-scan:
      # Bloquea el `git push` si hay puertos expuestos, contenedores en modo root
      # o vulnerabilidades críticas en dependencias (File System).
      run: ./auditar-infra.sh
