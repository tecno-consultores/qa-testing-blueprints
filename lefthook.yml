# ==============================================================================
# LEFTHOOK - BARRERA DE ENTRADA (Pre-commit, Commit-msg & Pre-push)
# ==============================================================================
# Esta configuración intercepta los comandos de Git y obliga a ejecutar validaciones
# efímeras en Docker ANTES de permitir que el código entre al historial de Git
# o sea enviado al repositorio remoto.

pre-commit:
  parallel: true
  commands:
    # --------------------------------------------------------------------------
    # ECOSISTEMA PYTHON & FASTAPI
    # --------------------------------------------------------------------------
    fastapi-lint:
      root: "fastapi/"
      glob: "*.py"
      run: docker compose -f docker-compose.qa.yml run --rm qa-backend bash -c "uv pip install --system -e '.[dev]' -q && ruff check {staged_files} && ruff format --check {staged_files}"

    python-lint:
      root: "python/"
      glob: "*.py"
      run: docker compose -f docker-compose.qa.yml run --rm qa-backend bash -c "uv pip install --system -e '.[dev]' -q && ruff check {staged_files} && ruff format --check {staged_files}"

    # --------------------------------------------------------------------------
    # ECOSISTEMA JAVASCRIPT (NODE, VUE3 & REACT)
    # --------------------------------------------------------------------------
    vue3-lint:
      root: "vue3/"
      glob: "*.{js,ts,vue}"
      run: docker compose -f docker-compose.qa.yml run --rm qa-vue3 bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"

    react-lint:
      root: "react-frontend/"
      glob: "*.{js,ts,tsx}"
      run: docker compose -f docker-compose.qa.yml run --rm qa-frontend bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"

    node-backend-lint:
      root: "node-backend/"
      glob: "*.{js,ts}"
      run: docker compose -f docker-compose.qa.yml run --rm qa-node-backend bash -c "pnpm install --silent && npx prettier --check {staged_files} && npx eslint {staged_files}"

    # --------------------------------------------------------------------------
    # ECOSISTEMA PHP 8.2-8.5
    # --------------------------------------------------------------------------
    php-lint:
      root: "php/"
      glob: "*.php"
      run: docker compose -f docker-compose.qa.yml run --rm qa-php composer --quiet run-script qa:lint

    # --------------------------------------------------------------------------
    # ECOSISTEMA BASH (DEVOPS)
    # --------------------------------------------------------------------------
    bash-lint:
      root: "bash-scripts/"
      glob: "*.sh"
      # shellCheck evalúa vulnerabilidades POSIX, shfmt verifica la estética (-d es modo dry-run/check)
      run: docker compose -f docker-compose.qa.yml run --rm qa-bash bash -c "shellcheck {staged_files} && shfmt -d {staged_files}"

    # --------------------------------------------------------------------------
    # PROTECCIÓN DE SECRETOS (Global)
    # --------------------------------------------------------------------------
    leaks-check:
      glob: "**/*"
      # Ejecuta el escáner corporativo unificado (entropía, llaves privadas, tokens y .env)
      run: ./scripts/verificar-secretos.sh {staged_files}

    # --------------------------------------------------------------------------
    # GOBERNANZA ZERO-LLM, SECRETOS E INVARIANTES DOCUMENTALES (QA-11X v2.0)
    # --------------------------------------------------------------------------
    governance-sync-check:
      run: docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/app:ro" -w /app sinfallas/base-python-uv:3.15 python3 .agents/scripts/sync_governance.py --check

    secret-scan:
      run: ./scripts/verificar-secretos.sh

    docs-invariants:
      glob: "{*.md,**/*.md,manifest.json,.agents/*,.agents/**/*}"
      run: docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/app:ro" -w /app sinfallas/base-python-uv:3.15 python3 .agents/scripts/verify_docs_invariants.py

commit-msg:
  commands:
    # --------------------------------------------------------------------------
    # AUDITORÍA DE CONVENCIONES DE GIT (Conventional Commits — Rule Zero POSIX)
    # --------------------------------------------------------------------------
    conventional-commits:
      # Valida Conventional Commits en Bash puro sin exigir Node.js/npx en el host
      run: bash -c 'first_line=$(head -n 1 "{1}"); printf "%s\n" "$first_line" | grep -Eq "^(Merge |Revert \"|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.,/-]+\))?!?: .+)" || { echo "❌ [Conventional Commits] Formato requerido: <tipo>(<alcance>): <descripción>" >&2; exit 1; }'

pre-push:
  commands:
    # --------------------------------------------------------------------------
    # AUDITORÍA DE INFRAESTRUCTURA (IaC), E2E MCP, KARATE BDD, PYTHON Y BASH (1:1 CI)
    # --------------------------------------------------------------------------
    trivy-iac-scan:
      # Bloquea el `git push` si hay puertos expuestos, contenedores en modo root
      # o vulnerabilidades críticas en dependencias (File System).
      run: ./scripts/auditar-infra.sh

    mcp-example-smoke:
      glob: "{mcp-server/**,manifest.json}"
      run: ./scripts/probar-mcp-example.sh --in-place

    mcp-unit-and-lint:
      glob: "{mcp-server/**,manifest.json}"
      run: bash -c '[ ! -f mcp-server/package.json ] && exit 0; docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e PNPM_HOME=/tmp/pnpm -e pnpm_config_store_dir=/tmp/.pnpm-store -v "$(pwd)/mcp-server:/app" -w /app sinfallas/base-node-ionic:26 bash -c "[ -d node_modules/.bin ] || pnpm install --frozen-lockfile --silent; pnpm --silent run lint && pnpm --silent run typecheck && pnpm --silent run test:unit && rm -rf coverage .eslintcache"'

    python-governance-and-meta-qa:
      run: bash -c '[ ! -f scripts/generar-manifiesto.py ] && exit 0; docker run --rm -e COVERAGE_FILE=/tmp/.coverage -e UV_CACHE_DIR=/tmp/uv-cache -e RUFF_CACHE_DIR=/tmp/ruff-cache -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/app" -w /app sinfallas/base-python-uv:3.15 bash -c "python3 scripts/generar-manifiesto.py --check && python3 .agents/scripts/sync_governance.py --check && python3 .agents/scripts/verify_docs_invariants.py && python3 .agents/scripts/verify_roadmap_consistency.py && python3 .agents/scripts/verify_topological_health.py && python3 .agents/scripts/verify_json_no_duplicate_keys.py && ruff check tests/meta_qa .agents/scripts/release_readiness_gate.py && uv run --with pytest --with pytest-cov pytest -o cache_dir=/tmp/pytest-cache --import-mode=importlib tests/*.unit.py tests/meta_qa/test_governance_scripts.py -q"'

    karate-bdd-contracts:
      glob: "{mcp-server/**,manifest.json,.agents/skills/**}"
      run: bash -c '[ ! -d mcp-server/test ] && exit 0; docker run --rm -v "$(pwd)/mcp-server/test:/app/src/test/java/examples/test:ro" -v "$(pwd):/repo:ro" sinfallas/karatelabs:1.5.1 mvn -B -q clean test'

    bash-shellcheck-bats:
      run: bash -c '[ ! -d bash-scripts/test ] && exit 0; docker run --rm -v "$(pwd):/repo:ro" -w /repo/bash-scripts sinfallas/base-bash-qa:latest bash -c "shellcheck -x ../scripts/*.sh ../.agents/scripts/*.sh ../instalar-hooks.sh ./*.sh && bats test/*.bats ../tests/bats/*.bats"'

    calm-architecture-gate:
      run: bash -c '[ ! -x .agents/scripts/validate_calm_architecture.sh ] && exit 0; ./.agents/scripts/validate_calm_architecture.sh'

    certify-11x-gate:
      run: bash -c '[ ! -x .agents/scripts/certify_task_completion.sh ] && exit 0; ./.agents/scripts/certify_task_completion.sh'
