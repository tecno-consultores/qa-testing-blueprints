[pytest]
addopts = --import-mode=importlib --strict-markers --strict-config
cache_dir = /tmp/pytest-cache
asyncio_default_fixture_loop_scope = function
python_files = *.unit.py test_*.py
filterwarnings =
    ignore::DeprecationWarning:deepeval.*
    ignore::SyntaxWarning:deepeval.*
    ignore:.*HallucinationMetric.*:DeprecationWarning
