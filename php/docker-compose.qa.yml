# Orquestador efímero QA 11X para PHP 8.2-8.5 (sinfallas/basephpcomposer)

services:
  composer-cache-init:
    image: ${PHP_IMAGE:-sinfallas/basephpcomposer:8.5@sha256:56ff6d2dbf8b13833555b56ddc517bf520506b669c235026bb23224b212f0208}
    pull_policy: if_not_present
    mem_limit: 256m
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - composer-cache:/tmp/composer-cache
    command: ["chmod", "-R", "a+rwX", "/tmp/composer-cache"]

  postgres-qa:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    pull_policy: if_not_present
    mem_limit: 1g
    profiles:
      - integration
      - load
      - chaos
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password_ephemeral
      POSTGRES_DB: qa_db
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  keydb-qa:
    image: eqalpha/keydb@sha256:6537505c42355ca1f571276bddf83f5b750f760f07b2a185a676481791e388ac
    pull_policy: if_not_present
    mem_limit: 512m
    profiles:
      - integration
      - load
      - chaos
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    command: keydb-server --server-threads 2 --appendonly no --save ""
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  qa-php:
    image: ${PHP_IMAGE:-sinfallas/basephpcomposer:8.5@sha256:56ff6d2dbf8b13833555b56ddc517bf520506b669c235026bb23224b212f0208}
    pull_policy: if_not_present
    mem_limit: 2g
    working_dir: /var/www
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    # Si monta php.ini personalizado, móntelo en /usr/local/etc/php/conf.d/99-qa11x.ini:ro para prevalecer sobre docker-php-ext-pcov.ini
    volumes:
      - .:/var/www
      - composer-cache:/tmp/composer-cache
    environment:
      HOME: /tmp
      APP_ENV: testing
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DATABASE_URL: postgresql://app_user:app_password@postgres-qa:5432/qa_db?serverVersion=17&charset=utf8
      MIGRATION_DATABASE_URL: postgresql://qa_user:qa_password_ephemeral@postgres-qa:5432/qa_db?serverVersion=17&charset=utf8
      REDIS_URL: redis://keydb-qa:6379/0
      PCOV_ENABLED: "1"
    depends_on:
      composer-cache-init:
        condition: service_completed_successfully
    command: sh -c "echo 'Contenedor QA PHP listo (Rule Zero, aislado sin DB/KeyDB). Usa docker compose run --rm -T qa-php [comando]'; sleep infinity"

  php-api:
    image: ${PHP_IMAGE:-sinfallas/basephpcomposer:8.5@sha256:56ff6d2dbf8b13833555b56ddc517bf520506b669c235026bb23224b212f0208}
    container_name: php_qa_api
    pull_policy: if_not_present
    mem_limit: 2g
    profiles:
      - integration
      - load
      - chaos
    working_dir: /var/www
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/var/www
      - composer-cache:/tmp/composer-cache
    environment:
      HOME: /tmp
      APP_ENV: testing
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DATABASE_URL: postgresql://app_user:app_password@postgres-qa:5432/qa_db?serverVersion=17&charset=utf8
      MIGRATION_DATABASE_URL: postgresql://qa_user:qa_password_ephemeral@postgres-qa:5432/qa_db?serverVersion=17&charset=utf8
      REDIS_URL: redis://keydb-qa:6379/0
      PCOV_ENABLED: "0"
      PHP_CLI_SERVER_WORKERS: "4"
    depends_on:
      composer-cache-init:
        condition: service_completed_successfully
      postgres-qa:
        condition: service_healthy
      keydb-qa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8000) ? 0 : 1);'"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: sh -c "([ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist -q) && if [ -d public ]; then php -d expose_php=0 -S 0.0.0.0:8000 -t public; else php -d expose_php=0 -S 0.0.0.0:8000; fi"

  karatelabs:
    image: sinfallas/karatelabs:1.5.1@sha256:a9a52ca9c5491ab39b64f0b4fdc3dea879c2213c9bc995be58d6cd4b9a80cc89
    pull_policy: if_not_present
    mem_limit: 2g
    profiles:
      - integration
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./test:/app/src/test/java/examples/test:ro
    environment:
      API_BASE_URL: http://php-api:8000
    depends_on:
      php-api:
        condition: service_healthy
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose --profile integration run --rm -T karatelabs mvn -B clean test'; sleep infinity"

  zap:
    image: zaproxy/zap-stable:2.15.0@sha256:8dc78e39fafc3281ac2cf54eab05c3ea02721a1ea58f1c135f981a57f4e218b1
    pull_policy: if_not_present
    mem_limit: 2g
    profiles:
      - integration
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
    working_dir: /zap/wrk
    volumes:
      - .:/zap/wrk
    depends_on:
      php-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'php_qa'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['php-api:8000']
        " > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      php-api:
        condition: service_healthy

  k6-smoke:
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    pull_policy: if_not_present
    mem_limit: 512m
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    profiles:
      - load
    environment:
      K6_PROFILE: ${K6_PROFILE:-smoke}
      API_BASE_URL: ${API_BASE_URL:-http://php-api:8000}
      QA_TENANT_ID: ${QA_TENANT_ID:-tenant-alpha}
      K6_P95_MS: ${K6_P95_MS:-250}
      K6_P99_MS: ${K6_P99_MS:-500}
      K6_SUMMARY_PATH: /tmp/k6-reports/k6-summary.json
    volumes:
      - ./tests/load:/scripts:ro
      - ./reports:/tmp/k6-reports:rw
    command: ["run", "/scripts/smoke.k6.js"]
    depends_on:
      php-api:
        condition: service_healthy

  pumba:
    image: gaiaadm/pumba:0.10.1@sha256:07f89803f5ce89d2ae0bf0b67d0fc3e094324626afd2e2402bcd9dc62ff409f5
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      php-api:
        condition: service_healthy
    command: netem --tc-image gaiadocker/iproute2@sha256:d0cd5819fbeaf2e7501dcb223bb5bad4fda7c1e76ff9877baba6e559c70b6d1e --duration 30s delay --time 250 --jitter 25 re2:^php_qa_api$

volumes:
  composer-cache:
