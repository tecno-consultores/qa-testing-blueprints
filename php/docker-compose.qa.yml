# Orquestador efímero QA 11X para PHP 8.2-8.5 (sinfallas/basephpcomposer)

services:
  postgres-qa:
    image: postgres:17-alpine
    pull_policy: if_not_present
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password_ephemeral
      POSTGRES_DB: qa_db
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  keydb-qa:
    image: eqalpha/keydb:6.3.4
    pull_policy: if_not_present
    command: keydb-server --server-threads 2 --appendonly no --save ""
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  qa-php:
    image: sinfallas/basephpcomposer:${PHP_VERSION:-8.5}
    pull_policy: if_not_present
    working_dir: /var/www
    user: "1000:1000"
    volumes:
      - .:/var/www
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: testing
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DATABASE_URL: postgresql://qa_user:qa_password_ephemeral@postgres-qa:5432/qa_db?serverVersion=17&charset=utf8
      REDIS_URL: redis://keydb-qa:6379/0
      PCOV_ENABLED: "1"
    depends_on:
      postgres-qa:
        condition: service_healthy
      keydb-qa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8000) ? 0 : 1);'"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: sh -c "if [ -d public ]; then php -S 0.0.0.0:8000 -t public; else php -S 0.0.0.0:8000; fi"

  karatelabs:
    image: sinfallas/karatelabs:1.5.1
    pull_policy: if_not_present
    volumes:
      - ./test:/app/src/test/java/examples/test
    environment:
      API_BASE_URL: http://qa-php:8000
    depends_on:
      qa-php:
        condition: service_healthy
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn -B clean test'; sleep infinity"

  zap:
    image: zaproxy/zap-stable:2.15.0
    pull_policy: if_not_present
    working_dir: /zap/wrk
    volumes:
      - .:/zap/wrk
    depends_on:
      qa-php:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    pull_policy: if_not_present
    profiles:
      - chaos
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'php_qa'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['qa-php:8000']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      qa-php:
        condition: service_healthy

  pumba:
    image: gaiaadm/pumba:0.10.1
    pull_policy: if_not_present
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      qa-php:
        condition: service_healthy
    command: netem --tc-image gaiadocker/iproute2 --duration 30s delay --time 250 --jitter 25 re2:.*qa-php.*

volumes:
  composer-cache:
