# Orquestador efímero QA 11X para PHP 8.2-8.5 (sinfallas/basephpcomposer)

services:
  composer-cache-init:
    image: sinfallas/basephpcomposer:${PHP_VERSION:-8.5}
    pull_policy: if_not_present
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - composer-cache:/tmp/composer-cache
    command: ["chmod", "-R", "a+rwX", "/tmp/composer-cache"]

  postgres-qa:
    image: postgres:17-alpine
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password_ephemeral
      POSTGRES_DB: qa_db
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  keydb-qa:
    image: eqalpha/keydb:6.3.4
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    command: keydb-server --server-threads 2 --appendonly no --save ""
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  qa-php:
    image: sinfallas/basephpcomposer:${PHP_VERSION:-8.5}
    pull_policy: if_not_present
    working_dir: /var/www
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    # Si monta php.ini personalizado, móntelo en /usr/local/etc/php/conf.d/99-qa11x.ini:ro para prevalecer sobre docker-php-ext-pcov.ini
    volumes:
      - .:/var/www
      - composer-cache:/tmp/composer-cache
    environment:
      HOME: /tmp
      APP_ENV: testing
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DATABASE_URL: postgresql://qa_user:qa_password_ephemeral@postgres-qa:5432/qa_db?serverVersion=17&charset=utf8
      REDIS_URL: redis://keydb-qa:6379/0
      PCOV_ENABLED: "1"
    depends_on:
      composer-cache-init:
        condition: service_completed_successfully
      postgres-qa:
        condition: service_healthy
      keydb-qa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8000) ? 0 : 1);'"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: sh -c "if [ -d public ]; then php -S 0.0.0.0:8000 -t public; else php -S 0.0.0.0:8000; fi"

  karatelabs:
    image: sinfallas/karatelabs:1.5.1
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./test:/app/src/test/java/examples/test
    environment:
      API_BASE_URL: http://qa-php:8000
    depends_on:
      qa-php:
        condition: service_healthy
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm -T karatelabs mvn -B clean test'; sleep infinity"

  zap:
    image: zaproxy/zap-stable:2.15.0
    pull_policy: if_not_present
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
    working_dir: /zap/wrk
    volumes:
      - .:/zap/wrk
    depends_on:
      qa-php:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'php_qa'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['qa-php:8000']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      qa-php:
        condition: service_healthy

  k6-smoke:
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    pull_policy: if_not_present
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    profiles:
      - load
    environment:
      K6_PROFILE: ${K6_PROFILE:-smoke}
      API_BASE_URL: ${API_BASE_URL:-http://qa-php:8000}
      QA_TENANT_ID: ${QA_TENANT_ID:-tenant-alpha}
      K6_SUMMARY_PATH: /tmp/k6-summary.json
    volumes:
      - ./tests/load:/scripts:ro
    command: ["run", "/scripts/smoke.k6.js"]
    depends_on:
      qa-php:
        condition: service_healthy

  pumba:
    image: gaiaadm/pumba:0.10.1
    pull_policy: if_not_present
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      qa-php:
        condition: service_healthy
    command: netem --tc-image gaiadocker/iproute2 --duration 30s delay --time 250 --jitter 25 re2:.*qa-php.*

volumes:
  composer-cache:
