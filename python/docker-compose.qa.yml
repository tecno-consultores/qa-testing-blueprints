services:
  qa-backend:
    image: sinfallas/base-python-uv:3.13
    container_name: python_qa_backend
    hostname: python_qa_backend
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
      UV_PYTHON_DOWNLOADS: 'true'
      UV_CACHE_DIR: /root/.cache/uv
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
    working_dir: /app
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "echo 'Contenedor QA Backend (Python) listo. Utilice docker compose run --rm qa-backend [comando]'; sleep infinity"

  prometheus:
    image: prom/prometheus:latest
    container_name: python_prometheus
    hostname: python_prometheus
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'python_scripts_daemon'
            static_configs:
              - targets: ['qa-backend:8000']
          - job_name: 'python_scripts_pushgateway'
            honor_labels: true
            static_configs:
              - targets: ['python_pushgateway:9091']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - qa-backend
      - pushgateway

  pushgateway:
    image: prom/pushgateway:latest
    container_name: python_pushgateway
    hostname: python_pushgateway
    profiles:
      - observability
    ports:
      - "9091:9091"

  graphify:
    image: sinfallas/remote-graphify:latest
    container_name: python_graphify
    hostname: python_graphify
    profiles:
      - graphify
    restart: always
    command: graphify-mcp /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
    volumes:
      - .:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  default:
    driver: bridge

volumes:
  uv-cache:
    name: python_scripts_uv_cache
