services:
  qa-backend:
    image: sinfallas/base-python-uv:3.15
    container_name: python_qa_backend
    hostname: python_qa_backend
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
      UV_PYTHON_DOWNLOADS: 'true'
      UV_CACHE_DIR: /tmp/uv-cache
      COVERAGE_FILE: '/tmp/.coverage'
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "echo 'Contenedor QA Backend (Python) listo. Utilice docker compose run --rm qa-backend [comando]'; sleep infinity"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: python_prometheus
    hostname: python_prometheus
    pull_policy: if_not_present
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'python_scripts_daemon'
            static_configs:
              - targets: ['qa-backend:8000']
          - job_name: 'python_scripts_pushgateway'
            honor_labels: true
            static_configs:
              - targets: ['python_pushgateway:9091']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - qa-backend
      - pushgateway

  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: python_pushgateway
    hostname: python_pushgateway
    pull_policy: if_not_present
    profiles:
      - observability
    ports:
      - "9091:9091"

networks:
  default:
    driver: bridge

volumes:
  uv-cache:
    name: python_scripts_uv_cache
