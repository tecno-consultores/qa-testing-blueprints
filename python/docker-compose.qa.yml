services:
  uv-cache-init:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    pull_policy: if_not_present
    mem_limit: 256m
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - uv-cache:/tmp/uv-cache
    command: ["chmod", "-R", "a+rwX", "/tmp/uv-cache"]

  qa-backend:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    container_name: python_qa_backend
    hostname: python_qa_backend
    pull_policy: if_not_present
    mem_limit: 2g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      TZ: 'America/Caracas'
      UV_PYTHON_DOWNLOADS: 'true'
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
      COVERAGE_FILE: '/tmp/.coverage'
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Backend (Python) listo. Utilice docker compose run --rm -T qa-backend [comando]'; sleep infinity"

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: python_prometheus
    hostname: python_prometheus
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'python_scripts_daemon'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['python-api:8000']
          - job_name: 'python_scripts_pushgateway'
            honor_labels: true
            static_configs:
              - targets: ['python_pushgateway:9091']
        " > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      python-api:
        condition: service_healthy
      pushgateway:
        condition: service_started

  pushgateway:
    image: prom/pushgateway:v1.10.0@sha256:7a4d0696a24ef4e8bad62bee5656855a0aff2f26416d8cb32009dc28d6263604
    container_name: python_pushgateway
    hostname: python_pushgateway
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    ports:
      - "127.0.0.1:9091:9091"

  python-api:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    container_name: python_qa_api
    hostname: python-api
    pull_policy: if_not_present
    mem_limit: 1g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    profiles:
      - load
      - observability
      - profile
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      TZ: 'America/Caracas'
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    command:
      - bash
      - -c
      - |
        cat <<'EOF' > /tmp/qa_http.py
        import http.server
        import json

        class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
            if self.path == '/health':
              b = json.dumps({'status': 'ok'}).encode()
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.end_headers()
              self.wfile.write(b)
            elif self.path == '/metrics':
              b = b'# HELP python_qa_up QA daemon status\npython_qa_up 1\n'
              self.send_response(200)
              self.send_header('Content-Type', 'text/plain')
              self.end_headers()
              self.wfile.write(b)
            else:
              self.send_response(404)
              self.end_headers()

          def log_message(self, *a):
            pass

        http.server.ThreadingHTTPServer(('0.0.0.0', 8000), H).serve_forever()
        EOF
        exec $${PYTHON_HTTP_CMD:-python3 /tmp/qa_http.py}

  k6-smoke:
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    container_name: python_k6_smoke
    hostname: python_k6_smoke
    pull_policy: if_not_present
    mem_limit: 512m
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    profiles:
      - load
    environment:
      K6_PROFILE: ${K6_PROFILE:-smoke}
      API_BASE_URL: ${API_BASE_URL:-http://python-api:8000}
      QA_TENANT_ID: ${QA_TENANT_ID:-tenant-alpha}
      K6_SUMMARY_PATH: /tmp/k6-summary.json
    volumes:
      - ./tests/load:/scripts:ro
    command: ["run", "/scripts/smoke.k6.js"]
    depends_on:
      python-api:
        condition: service_healthy

  profiler:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    container_name: python_profiler
    hostname: python_profiler
    pull_policy: if_not_present
    mem_limit: 1g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    pid: "service:python-api"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    profiles:
      - profile
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
      python-api:
        condition: service_healthy
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    command: bash -c "uv sync --all-extras -q && mkdir -p /app/reports && pid=\$$(pgrep -f python | head -n 1); [ -n \"\$$pid\" ] || pid=1; /tmp/qa-venv/bin/py-spy record -o /app/reports/flamegraph.svg --subprocesses --duration 15 --pid \"\$$pid\""

networks:
  default:
    driver: bridge

volumes:
  uv-cache:
    name: python_scripts_uv_cache
