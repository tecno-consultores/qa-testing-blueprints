services:
  uv-cache-init:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    pull_policy: if_not_present
    mem_limit: 256m
    restart: "no"
    cpus: "${QA_INIT_CPU_LIMIT:-1.0}"
    pids_limit: 64
    network_mode: none
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - uv-cache:/tmp/uv-cache
    command: ["chmod", "-R", "a+rwX", "/tmp/uv-cache"]

  qa-backend:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    hostname: python_qa_backend
    pull_policy: if_not_present
    mem_limit: 2g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      TZ: 'America/Caracas'
      UV_PYTHON_DOWNLOADS: 'true'
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
      COVERAGE_FILE: '/tmp/.coverage'
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Backend (Python) listo. Utilice docker compose run --rm -T qa-backend [comando]'; sleep infinity"

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    hostname: python_prometheus
    pull_policy: if_not_present
    mem_limit: 512m
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'python_scripts_daemon'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['python-api:8000']
          - job_name: 'python_scripts_pushgateway'
            honor_labels: true
            static_configs:
              - targets: ['pushgateway:9091']
        " > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      python-api:
        condition: service_healthy
      pushgateway:
        condition: service_started

  pushgateway:
    image: prom/pushgateway:v1.10.0@sha256:7a4d0696a24ef4e8bad62bee5656855a0aff2f26416d8cb32009dc28d6263604
    hostname: python_pushgateway
    pull_policy: if_not_present
    mem_limit: 512m
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    ports:
      - "127.0.0.1:9091:9091"

  python-api:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    hostname: python-api
    pull_policy: if_not_present
    mem_limit: 1g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    profiles:
      - load
      - observability
      - profile
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      TZ: 'America/Caracas'
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTHON_HTTP_CMD: ${PYTHON_HTTP_CMD:-}
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    command:
      - bash
      - -c
      - |
        cat <<'EOF' > /tmp/qa_http.py
        import http.server
        import json

        class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
            if self.path == '/health':
              b = json.dumps({'status': 'ok'}).encode()
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.end_headers()
              self.wfile.write(b)
            elif self.path == '/metrics':
              b = b'# HELP python_qa_up QA daemon status\npython_qa_up 1\n'
              self.send_response(200)
              self.send_header('Content-Type', 'text/plain')
              self.end_headers()
              self.wfile.write(b)
            else:
              self.send_response(404)
              self.end_headers()

          def do_POST(self):
            length = int(self.headers.get('Content-Length') or 0)
            if length:
              self.rfile.read(length)
            idem = self.headers.get('Idempotency-Key', '')
            if self.path == '/api/v1/reservations':
              b = json.dumps({
                'reservationId': '7c9e6679-7425-40de-944b-e07fc1f90ae7',
                'status': 'CONFIRMED',
                'unitPrice': '149.95',
              }).encode()
              self.send_response(201)
              self.send_header('Content-Type', 'application/json')
              if idem:
                self.send_header('Idempotency-Key', idem)
              self.end_headers()
              self.wfile.write(b)
            elif self.path == '/api/v1/reservations/batch':
              b = json.dumps({
                'results': [
                  {'sku': 'ROUTER-CCR2004', 'status': 'SUCCEEDED'},
                  {'sku': 'SWITCH-CRS326', 'status': 'SUCCEEDED'},
                ]
              }).encode()
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              if idem:
                self.send_header('Idempotency-Key', idem)
              self.end_headers()
              self.wfile.write(b)
            else:
              self.send_response(404)
              self.end_headers()

          def log_message(self, *a):
            pass

        http.server.ThreadingHTTPServer(('0.0.0.0', 8000), H).serve_forever()
        EOF
        if [ -n "$${PYTHON_HTTP_CMD:-}" ] && [ -f pyproject.toml ]; then uv sync --all-extras -q; fi
        exec $${PYTHON_HTTP_CMD:-python3 /tmp/qa_http.py}

  k6-smoke:
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    hostname: python_k6_smoke
    pull_policy: if_not_present
    mem_limit: 512m
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    profiles:
      - load
    environment:
      HOME: /tmp
      K6_PROFILE: ${K6_PROFILE:-smoke}
      API_BASE_URL: ${API_BASE_URL:-http://python-api:8000}
      QA_TENANT_ID: ${QA_TENANT_ID:-tenant-alpha}
      K6_SUMMARY_PATH: ${K6_SUMMARY_PATH:-/reports/k6-summary.json}
    volumes:
      - ./tests/load:/scripts:ro
      - ./reports:/reports:rw
    command: ["run", "/scripts/smoke.k6.js"]
    depends_on:
      python-api:
        condition: service_healthy

  profiler:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    hostname: python_profiler
    pull_policy: if_not_present
    mem_limit: 1g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "0:0"
    pid: "service:python-api"
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - DAC_OVERRIDE
      - CHOWN
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    profiles:
      - profile
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
      python-api:
        condition: service_healthy
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
      QA_UID: ${QA_UID:-1000}
      QA_GID: ${QA_GID:-1000}
    volumes:
      - .:/app:ro
      - ./reports:/reports:rw
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    command: bash -c "(uv sync --frozen --all-extras --no-install-project -q 2>/dev/null || (cd /tmp && uv venv -q /tmp/qa-venv && uv pip install --no-config --python /tmp/qa-venv/bin/python -q py-spy)) && pid=\$$(python3 -c 'import os, pathlib; me=str(os.getpid()); p=[d.name for d in pathlib.Path(\"/proc\").iterdir() if d.name.isdigit() and d.name!=me and \"python\" in (d/\"comm\").read_text(errors=\"ignore\")]; print(p[0] if p else 1)') && /tmp/qa-venv/bin/py-spy record --idle -o /reports/flamegraph.svg --subprocesses --duration 15 --pid \"\$$pid\" && chown \"$${QA_UID}:$${QA_GID}\" /reports/flamegraph.svg"

networks:
  default:
    driver: bridge

volumes:
  uv-cache:
    name: python_scripts_uv_cache
