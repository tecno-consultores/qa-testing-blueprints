[project]
name = "python-qa-blueprint"
version = "0.1.0"
description = "Plantilla base para scripts de Python con pruebas exhaustivas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "tox>=4.14.0",
    "tox-uv>=1.16.0",
    "bandit>=1.7.8",
    "mutmut>=2.4.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "integration: Pruebas que requieren conexión a internet (deseleccionar con '-m \"not integration\"')",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
strict = true

[tool.mutmut]
paths_to_mutate = "src/"
backup = false
runner = "python -m pytest -x"
tests_dir = "tests/"
