services:
  api:
    image: sinfallas/base-python-uv:3.13
    container_name: fastapi_api
    hostname: api
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "uv pip install --system -e '.[dev]' && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  test:
    image: sinfallas/base-python-uv:3.13
    container_name: fastapi_test
    hostname: test_env
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
      UV_PYTHON_DOWNLOADS: 'true'
    volumes:
      - .:/app
    working_dir: /app
    cap_add:
      - SYS_PTRACE
    command: bash -c "echo 'Contenedor Python listo. Usa docker compose run --rm test [comando]'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:latest
    container_name: fastapi_karate
    pull_policy: always
    depends_on:
      - api
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn clean test'; sleep infinity"

  zap:
    image: owasp/zap2docker-stable:latest
    container_name: fastapi_zap
    pull_policy: always
    depends_on:
      - api
    user: root 
    volumes:
      - .:/zap/wrk/:rw
    command: bash -c "echo 'Contenedor ZAP listo. Usa docker compose run --rm zap zap-baseline.py -t http://api:8000 -r zap-report.html'; sleep infinity"

  pumba:
    image: gaiaadm/pumba:latest
    container_name: fastapi_pumba
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    command: netem --tc-image gaiadocker/iproute2 --duration 1m delay --time 500 --jitter 50 re2:^fastapi_api$

  stress_test:
    image: sinfallas/base-python-uv:3.13
    container_name: fastapi_chaos_locust
    profiles:
      - chaos
    depends_on:
      - api
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "uv pip install --system -e '.[dev]' && echo 'Esperando asimilación del caos...' && sleep 5 && locust -f locustfile.py --headless -u 200 -r 20 -t 1m --host http://api:8000 --html chaos-report.html"

  graphify:
    image: sinfallas/remote-graphify:latest
    container_name: fastapi_graphify
    hostname: graphify
    profiles:
      - graphify
    restart: always
    command: uvx --from graphifyy python -m graphify.serve /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Configuración local para OmniRoute o Llama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
      # Modelos Cloud (Descomentar e inyectar vía .env si se requiere)
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - ANTHROPIC_MODEL=claude-3-5-sonnet-latest
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      # - OPENAI_MODEL=gpt-4o-mini
    volumes:
      - .:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  default:
    driver: bridge
