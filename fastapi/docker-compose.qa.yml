services:
  uv-cache-init:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    pull_policy: if_not_present
    mem_limit: 256m
    restart: "no"
    cpus: "${QA_INIT_CPU_LIMIT:-1.0}"
    pids_limit: 64
    network_mode: none
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - uv-cache:/tmp/uv-cache
    command: ["chmod", "-R", "a+rwX", "/tmp/uv-cache"]

  api:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    hostname: fastapi_api
    pull_policy: if_not_present
    mem_limit: 2g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
      TZ: 'America/Caracas'
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
      DATABASE_URL: 'postgresql+asyncpg://app_user:app_password@postgres:5432/qa_db'
      MIGRATION_DATABASE_URL: 'postgresql+asyncpg://qa_user:qa_password@postgres:5432/qa_db'
      REDIS_URL: 'redis://keydb:6379/0'
      APP_ENV: 'qa_test'
      PYTHONPATH: /app/src
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keydb:
        condition: service_healthy
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: bash -c "uv sync --all-extras -q && ([ ! -f alembic.ini ] || DATABASE_URL=\"$$MIGRATION_DATABASE_URL\" /tmp/qa-venv/bin/alembic upgrade head) && exec /tmp/qa-venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    hostname: postgres
    pull_policy: if_not_present
    mem_limit: 1g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: qa_db
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  keydb:
    image: eqalpha/keydb@sha256:6537505c42355ca1f571276bddf83f5b750f760f07b2a185a676481791e388ac
    hostname: keydb
    pull_policy: if_not_present
    mem_limit: 512m
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "999:999"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32M,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    command: >
      keydb-server
      --server-threads 2
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD-SHELL", "keydb-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  qa-backend:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    hostname: fastapi_qa_backend
    pull_policy: if_not_present
    mem_limit: 2g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      TZ: 'America/Caracas'
      UV_PYTHON_DOWNLOADS: 'true'
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
      DATABASE_URL: 'postgresql+asyncpg://app_user:app_password@postgres:5432/qa_db'
      MIGRATION_DATABASE_URL: 'postgresql+asyncpg://qa_user:qa_password@postgres:5432/qa_db'
      REDIS_URL: 'redis://keydb:6379/0'
      APP_ENV: 'qa_unit'
      COVERAGE_FILE: '/tmp/.coverage'
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: /app/src
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Backend (Python) listo para Lint, Pytest y Mutmut'; sleep infinity"

  # Nota: sinfallas/karatelabs:1.5.1 almacena caché Maven offline en /root/.m2 (0700) y /app/target (root:root); montajes host son estrictamente :ro
  karatelabs:
    image: sinfallas/karatelabs:1.5.1@sha256:a9a52ca9c5491ab39b64f0b4fdc3dea879c2213c9bc995be58d6cd4b9a80cc89
    hostname: fastapi_karate
    pull_policy: if_not_present
    mem_limit: 2g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./test:/app/src/test/java/examples/test:ro
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm -T karatelabs mvn clean test'; sleep infinity"

  zap:
    image: zaproxy/zap-stable:2.15.0@sha256:8dc78e39fafc3281ac2cf54eab05c3ea02721a1ea58f1c135f981a57f4e218b1
    hostname: fastapi_zap
    pull_policy: if_not_present
    mem_limit: 2g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 512
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
      _JAVA_OPTIONS: -Duser.home=/tmp
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/zap/wrk:ro
      - ./reports:/reports:rw
    command: bash -c "echo 'Contenedor ZAP listo. Usa docker compose run --rm -T zap zap.sh -dir /tmp/.ZAP -cmd -autorun /zap/wrk/zap.yaml (o cd /tmp && /zap/zap-baseline.py -t http://api:8000 -r /reports/zap-report.html -J /reports/zap-report.json -z \"-dir /tmp/.ZAP\")'; sleep infinity"

  pumba:
    image: gaiaadm/pumba:0.10.1@sha256:07f89803f5ce89d2ae0bf0b67d0fc3e094324626afd2e2402bcd9dc62ff409f5
    hostname: fastapi_pumba
    pull_policy: if_not_present
    mem_limit: 512m
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      api:
        condition: service_healthy
    command: netem --tc-image gaiadocker/iproute2@sha256:d0cd5819fbeaf2e7501dcb223bb5bad4fda7c1e76ff9877baba6e559c70b6d1e --duration 2m delay --time 500 --jitter 50 re2:.*[-_]api[-_][0-9]+$

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    hostname: fastapi_prometheus
    pull_policy: if_not_present
    mem_limit: 512m
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'fastapi_qa'
            metrics_path: '/metrics'
            static_configs:
              - targets: ['api:8000']
        " > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  k6-smoke:
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    hostname: fastapi_k6_smoke
    pull_policy: if_not_present
    mem_limit: 512m
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    profiles:
      - load
    environment:
      HOME: /tmp
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      QA_TENANT_ID: ${QA_TENANT_ID:-tenant-alpha}
      K6_PROFILE: ${K6_PROFILE:-smoke}
      K6_SUMMARY_PATH: '/tmp/k6-reports/k6-summary.json'
    volumes:
      - ./tests/load:/scripts:ro
      - ./reports:/tmp/k6-reports:rw
    depends_on:
      api:
        condition: service_healthy
    command: ["run", "/scripts/smoke.k6.js"]

  stress_test:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    hostname: fastapi_chaos_locust
    pull_policy: if_not_present
    mem_limit: 2g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 512
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    profiles:
      - chaos
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
    volumes:
      - .:/app
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    command: bash -c "mkdir -p reports && uv sync --all-extras -q && echo 'Esperando estabilización...' && sleep 5 && /tmp/qa-venv/bin/locust -f locustfile.py --headless -u 200 -r 20 -t 1m --host http://api:8000 --html reports/chaos-report.html"

  profiler:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    hostname: fastapi_profiler
    pull_policy: if_not_present
    mem_limit: 1g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    user: "0:0"
    pid: "service:api"
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - DAC_OVERRIDE
      - CHOWN
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    profiles:
      - profile
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/qa-venv
      QA_UID: ${QA_UID:-1000}
      QA_GID: ${QA_GID:-1000}
    volumes:
      - .:/app:ro
      - ./reports:/reports:rw
      - uv-cache:/tmp/uv-cache
    working_dir: /app
    command: bash -c "(uv sync --frozen --all-extras --no-install-project -q 2>/dev/null || (cd /tmp && uv venv -q /tmp/qa-venv && uv pip install --no-config --python /tmp/qa-venv/bin/python -q py-spy)) && pid=\$$(python3 -c 'import os, pathlib; me=str(os.getpid()); p=[d.name for d in pathlib.Path(\"/proc\").iterdir() if d.name.isdigit() and d.name!=me and \"uvicorn\" in (d/\"cmdline\").read_bytes().decode(errors=\"ignore\")]; print(p[0] if p else 1)') && /tmp/qa-venv/bin/py-spy record --idle -o /reports/flamegraph.svg --subprocesses --duration 15 --pid \"\$$pid\" && chown \"$${QA_UID}:$${QA_GID}\" /reports/flamegraph.svg"

networks:
  default:
    driver: bridge

volumes:
  uv-cache:
    name: fastapi_uv_cache
