services:
  ui-prod:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    hostname: react_ui_prod
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: 'America/Caracas'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  pnpm-store-init:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    pull_policy: if_not_present
    mem_limit: 256m
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - pnpm-store:/pnpm
    command: ["chmod", "-R", "a+rwX", "/pnpm"]

  qa-frontend:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    hostname: react_qa_frontend
    pull_policy: if_not_present
    mem_limit: 4g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
      pnpm_config_manage_package_manager_versions: 'false'
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Frontend (Node) listo para Lint, Type-Check, Unit y Mutación'; sleep infinity"

  ui-e2e:
    image: mcr.microsoft.com/playwright:v1.52.0-noble@sha256:a021500a801bab0611049217ffad6b9697d827205c15babb86a53bc1a61c02d5
    hostname: react_ui_e2e
    pull_policy: if_not_present
    mem_limit: 4g
    shm_size: '1gb'
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      COREPACK_HOME: /tmp/.corepack
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
      pnpm_config_engine_strict: 'false'
      pnpm_config_manage_package_manager_versions: 'false'
      PATH: /tmp/.corepack-bin:/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    entrypoint: ["bash", "-c", "mkdir -p /tmp/.corepack-bin && corepack enable --install-directory /tmp/.corepack-bin >/dev/null 2>&1 || true; exec \"$@\"", "--"]
    command: bash -c "echo 'Contenedor E2E listo. Usa docker compose run --rm -T ui-e2e [comando]'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:1.5.1@sha256:a9a52ca9c5491ab39b64f0b4fdc3dea879c2213c9bc995be58d6cd4b9a80cc89
    hostname: react_ui_karate
    pull_policy: if_not_present
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    depends_on:
      ui-prod:
        condition: service_healthy
    environment:
      - UI_BASE_URL=http://ui-prod:8080
    volumes:
      - ./test:/app/src/test/java/examples/test:ro
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm -T karatelabs mvn clean test'; sleep infinity"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0@sha256:6477cf3bddc4e042d3496856fb2e8e382301bac47fb18cb83924389717261cb1
    hostname: react_nginx_exporter
    pull_policy: if_not_present
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    command:
      - "-nginx.scrape-uri=http://ui-prod:8080/stub_status"
    ports:
      - "127.0.0.1:9113:9113"
    depends_on:
      ui-prod:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    hostname: react_prometheus
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'react_nginx'
            static_configs:
              - targets: ['nginx-exporter:9113']
        " > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - nginx-exporter

networks:
  default:
    driver: bridge

volumes:
  pnpm-store:
    name: react_pnpm_store
