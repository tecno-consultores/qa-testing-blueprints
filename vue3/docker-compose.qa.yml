services:
  ui-prod:
    image: nginx:alpine
    container_name: vue_ui_prod
    hostname: ui-prod
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

  ui-e2e:
    image: mcr.microsoft.com/playwright:v1.43.0-jammy
    container_name: vue_ui_e2e
    hostname: e2e_env
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "echo 'Contenedor E2E listo. Usa docker compose run --rm ui-e2e [comando]'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:latest
    container_name: vue_ui_karate
    pull_policy: always
    depends_on:
      - ui-prod
    environment:
      # Karate necesita saber dónde está la UI
      - UI_BASE_URL=http://ui-prod:80
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn clean test'; sleep infinity"

  graphify:
    image: sinfallas/remote-graphify:latest
    container_name: vue_graphify
    hostname: graphify
    profiles:
      - graphify
    restart: always
    command: uvx --from graphifyy python -m graphify.serve /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
      # Modelos Cloud (Descomentar e inyectar vía .env si se requiere)
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - ANTHROPIC_MODEL=claude-3-5-sonnet-latest
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      # - OPENAI_MODEL=gpt-4o-mini
    volumes:
      - .:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  default:
    driver: bridge
