services:
  ui-prod:
    image: nginx:1.27-alpine
    container_name: vue_ui_prod
    hostname: vue_ui_prod
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  pnpm-store-init:
    image: sinfallas/base-node-ionic:26
    pull_policy: if_not_present
    user: "0:0"
    volumes:
      - pnpm-store:/pnpm
    command: ["chmod", "-R", "a+rwX", "/pnpm"]

  qa-vue3:
    image: sinfallas/base-node-ionic:26
    container_name: vue_qa_frontend
    hostname: vue_qa_frontend
    pull_policy: if_not_present
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Vue 3 listo para Lint, Type-Check, Unit y Mutación'; sleep infinity"

  ui-e2e:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    container_name: vue_ui_e2e
    hostname: vue_ui_e2e
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
      PNPM_HOME: /pnpm
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    entrypoint: ["bash", "-c", "corepack enable >/dev/null 2>&1 && exec \"$@\"", "--"]
    command: bash -c "echo 'Contenedor E2E listo. Usa docker compose run --rm ui-e2e [comando]'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:1.5.1
    container_name: vue_ui_karate
    hostname: vue_ui_karate
    pull_policy: if_not_present
    depends_on:
      ui-prod:
        condition: service_healthy
    environment:
      - UI_BASE_URL=http://ui-prod:80
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn clean test'; sleep infinity"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: vue_nginx_exporter
    hostname: vue_nginx_exporter
    pull_policy: if_not_present
    profiles:
      - observability
    command:
      - "-nginx.scrape-uri=http://ui-prod:80/stub_status"
    ports:
      - "9113:9113"
    depends_on:
      ui-prod:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: vue_prometheus
    hostname: vue_prometheus
    pull_policy: if_not_present
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'vue_nginx'
            static_configs:
              - targets: ['nginx-exporter:9113']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - nginx-exporter

networks:
  default:
    driver: bridge

volumes:
  pnpm-store:
    name: vue_pnpm_store
  nginx-logs:
    name: vue_nginx_logs
