# Orquestación AI Evals 11X: DeepEval/Pytest Offline + Promptfoo OWASP LLM Red-Team (Regla Cero, non-root).

services:
  qa-evals:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    container_name: ai_evals_qa
    hostname: ai_evals_qa
    pull_policy: if_not_present
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: '1'
      COVERAGE_FILE: '/tmp/.coverage'
      UV_CACHE_DIR: /tmp/uv-cache
      RUFF_CACHE_DIR: /tmp/ruff-cache
      DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
      PYTHONPATH: /app
    volumes:
      - .:/app
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash -c "echo 'Contenedor QA AI-Evals listo (Regla Cero, non-root). Usa docker compose -f docker-compose.qa.yml run --rm -T qa-evals [comando]'; sleep infinity"

  qa-promptfoo:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    container_name: ai_evals_promptfoo
    hostname: ai_evals_promptfoo
    pull_policy: if_not_present
    profiles:
      - llm-live
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: '1'
      PROMPTFOO_CONFIG_DIR: /tmp/.promptfoo
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      OPENAI_API_BASE: "${OPENAI_API_BASE:-}"
      PROMPTFOO_JUDGE_PROVIDER: "${PROMPTFOO_JUDGE_PROVIDER:-}"
    volumes:
      - .:/app
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash -c "echo 'Contenedor Promptfoo 11X listo. Usa docker compose -f docker-compose.qa.yml --profile llm-live run --rm -T qa-promptfoo promptfoo eval -c promptfooconfig.yaml --no-cache'; sleep infinity"

networks:
  default:
    driver: bridge
