# Configuración oficial de Trivy para QA Testing Blueprints (Estándar QA 11X)
# Audita todos los archivos IaC (incluidos docker-compose.qa.yml); las exclusiones
# exclusivas de herramientas efímeras se acotan por regla/recurso en .trivyignore.yaml si aplica.
scan:
  skip-dirs:
    - "**/node_modules"
    - "**/.git"
    - "**/dist"
    - "**/target"
    - "**/graphify-out"
    - "**/vendor"
    - "**/.venv"
    - "**/mutants"
