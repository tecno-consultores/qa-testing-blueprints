services:
  qa-bash:
    image: sinfallas/base-bash-qa:latest
    container_name: bash_qa_env
    hostname: bash_qa_env
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
    volumes:
      - .:/app
    working_dir: /app
    # NOTA 11X: kcov requiere ptrace exclusivamente en el contenedor efímero de cobertura (prohibido en contenedores de producción)
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: bash -c "echo 'Contenedor QA Bash listo para ShellCheck, shfmt, BATS y kcov. Usa docker compose run --rm qa-bash [comando]'; sleep infinity"

  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: bash_pushgateway
    hostname: bash_pushgateway
    pull_policy: if_not_present
    profiles:
      - observability
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bash_prometheus
    hostname: bash_prometheus
    pull_policy: if_not_present
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'bash_pushgateway'
            static_configs:
              - targets: ['pushgateway:9091']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway

networks:
  default:
    driver: bridge
