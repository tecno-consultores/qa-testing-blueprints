services:
  qa-bash:
    image: sinfallas/base-bash-qa:1.0.0
    container_name: bash_qa_env
    hostname: bash_qa_env
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
    volumes:
      - .:/app
      - ..:/repo:ro
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Bash listo para ShellCheck y BATS. Usa docker compose run --rm qa-bash [comando]'; sleep infinity"

  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: bash_pushgateway
    hostname: bash_pushgateway
    pull_policy: if_not_present
    profiles:
      - observability
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bash_prometheus
    hostname: bash_prometheus
    pull_policy: if_not_present
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'bash_pushgateway'
            static_configs:
              - targets: ['pushgateway:9091']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway

  graphify:
    image: sinfallas/remote-graphify:1.0.0
    container_name: bash_graphify
    hostname: bash_graphify
    pull_policy: if_not_present
    profiles:
      - graphify
    restart: always
    command: graphify-mcp /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
    volumes:
      - .:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  default:
    driver: bridge
