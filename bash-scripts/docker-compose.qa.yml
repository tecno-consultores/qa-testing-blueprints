services:
  qa-bash:
    image: sinfallas/base-bash-qa@sha256:2d1f579e20ef384e85da839304dbae2d28231fcdc893c21cbe79861b44d675a7
    container_name: bash_qa_env
    hostname: bash_qa_env
    pull_policy: if_not_present
    mem_limit: 1g
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      _USER: qa
    volumes:
      - .:/app
    working_dir: /app
    # NOTA 11X: kcov requiere ptrace exclusivamente en el contenedor efímero de cobertura (prohibido en contenedores de producción)
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    command: bash -c "echo 'Contenedor QA Bash listo para ShellCheck, shfmt, BATS y kcov. Usa docker compose run --rm -T qa-bash [comando]'; sleep infinity"

  pushgateway:
    image: prom/pushgateway:v1.10.0@sha256:7a4d0696a24ef4e8bad62bee5656855a0aff2f26416d8cb32009dc28d6263604
    container_name: bash_pushgateway
    hostname: bash_pushgateway
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    ports:
      - "127.0.0.1:9091:9091"

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: bash_prometheus
    hostname: bash_prometheus
    pull_policy: if_not_present
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'bash_pushgateway'
            static_configs:
              - targets: ['pushgateway:9091']
        " > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - pushgateway

networks:
  default:
    driver: bridge
