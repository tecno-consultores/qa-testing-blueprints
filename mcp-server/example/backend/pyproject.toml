[project]
name = "example-telemetry-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "mutmut>=3.2.0",
  "pip-audit>=2.8.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "alembic", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["api.devices", "main"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=src --cov-fail-under=95 -q"
cache_dir = "/tmp/pytest-cache"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4

[tool.ruff.lint.isort]
known-first-party = ["api", "main", "models", "services"]
