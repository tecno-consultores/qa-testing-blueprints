[project]
name = "example-telemetry-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "mutmut>=3.2.0",
  "pip-audit>=2.8.0",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=src --cov-fail-under=95 -q"
