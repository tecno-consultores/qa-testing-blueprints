services:
  uv-cache-init:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    mem_limit: 256m
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    volumes:
      - example-uv-cache:/uv-cache
    entrypoint: ["chmod", "-R", "a+rwX", "/uv-cache"]

  qa-backend:
    image: sinfallas/base-python-uv:3.15@sha256:b5323179c6278cef2775d870fdfb4628f19ec2567430de8774889867961018c4
    mem_limit: 2g
    working_dir: /app/backend
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    depends_on:
      uv-cache-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      COVERAGE_FILE: /tmp/.coverage
      UV_CACHE_DIR: /tmp/uv-cache
      RUFF_CACHE_DIR: /tmp/.ruff_cache
      PYTHONPATH: /app/backend/src
    volumes:
      - .:/app
      - ${QA_UV_CACHE_DIR:-example-uv-cache}:/tmp/uv-cache

  pnpm-store-init:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    mem_limit: 256m
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    volumes:
      - example-pnpm-store:/pnpm
    entrypoint: ["chmod", "-R", "a+rwX", "/pnpm"]

  qa-frontend:
    image: sinfallas/base-node-ionic:26@sha256:275f3d8bbfef87f4e836e4f77d92c0d199821154079b050eaef53ce33ae6de60
    mem_limit: 2g
    working_dir: /app/frontend
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CI: "true"
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
    volumes:
      - .:/app
      - example-pnpm-store:/pnpm

  karate-ui:
    image: sinfallas/karatelabs:1.5.1@sha256:a9a52ca9c5491ab39b64f0b4fdc3dea879c2213c9bc995be58d6cd4b9a80cc89
    profiles:
      - e2e
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      UI_BASE_URL: ${UI_BASE_URL:-http://qa-frontend:5173}
    volumes:
      - ./frontend/test:/app/src/test/java/examples/test:ro
    command: bash -c "echo 'Contenedor Karate UI listo'; sleep infinity"

volumes:
  example-uv-cache:
  example-pnpm-store:
    name: mcp_example_pnpm_store
