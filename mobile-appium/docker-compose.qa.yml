# Orquestación Mobile QA 11X: Driver Bridge W3C + WebdriverIO v9 + ADB sin QEMU/KVM embebido.

services:
  pnpm-store-init:
    image: sinfallas/base-mobile-appium:26@sha256:1bb9e70613a786008fe06c418a557aeaa5fe7c62b3db29a26b4e0ce86d3c6728
    pull_policy: if_not_present
    mem_limit: 256m
    restart: "no"
    cpus: "${QA_INIT_CPU_LIMIT:-1.0}"
    pids_limit: 64
    network_mode: none
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - pnpm-store:/pnpm
    command: ["chmod", "-R", "a+rwX", "/pnpm"]

  qa-mobile:
    image: sinfallas/base-mobile-appium:26@sha256:1bb9e70613a786008fe06c418a557aeaa5fe7c62b3db29a26b4e0ce86d3c6728
    hostname: mobile_qa_runner
    pull_policy: if_not_present
    mem_limit: 4g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 512
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      pnpm-store-init:
        condition: service_completed_successfully
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      PNPM_HOME: /pnpm
      pnpm_config_store_dir: /pnpm/store
      NODE_PATH: /opt/qa11x/node_modules
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      APPIUM_HOME: /opt/appium-home
      QA_MOBILE_ARTIFACT_DIR: /tmp/qa-11x-mobile-artifacts
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash -c "echo 'Contenedor QA Mobile Appium 26 listo (Rule Zero, UID no-root). Usa docker compose -f docker-compose.qa.yml run --rm -T qa-mobile [comando]'; sleep infinity"

  appium-bridge:
    image: sinfallas/base-mobile-appium:26@sha256:1bb9e70613a786008fe06c418a557aeaa5fe7c62b3db29a26b4e0ce86d3c6728
    hostname: mobile_appium_bridge
    pull_policy: if_not_present
    mem_limit: 4g
    restart: "no"
    cpus: "${QA_CPU_LIMIT:-2.0}"
    pids_limit: 512
    profiles:
      - appium-live
    user: "${QA_UID:-1000}:${QA_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: 'America/Caracas'
      HOME: /tmp
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      APPIUM_HOME: /opt/appium-home
      ADB_SERVER_SOCKET: "${ADB_SERVER_SOCKET:-tcp:host.docker.internal:5037}"
    volumes:
      - .:/app
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4723:4723"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4723/status\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["appium", "--address", "0.0.0.0", "--port", "4723", "--base-path", "/", "--allow-insecure=uiautomator2:get_server_logs"]

volumes:
  pnpm-store:
